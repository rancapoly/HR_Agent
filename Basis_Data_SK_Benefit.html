l Jabatan (Level 1-2 dalam negeri dan Level 1 luar negeri sesuai tagihan yang wajar).", "Perjalanan Dinas", "Pasal 1; Lampiran I & III", "Definisi resmi SK", ""], ["15", "BOP Balen (Biaya Operasional Muatan Balen)", "BOP Balen", "Sejumlah biaya yang diberikan Perusahaan kepada Driver Truk dan Helper Truk untuk mendukung pengangkutan muatan balen sesuai Penugasan Operasional.", "UTH Driver", "Pasal 1 butir 10", "Definisi resmi SK", ""], ["16", "BPJS Kesehatan", "", "Program jaminan kesehatan nasional (UU 24/2011) yang tetap diikuti Karyawan Level 1-5; dimanfaatkan lebih dahulu untuk rawat inap dan penyakit kronis.", "Kesehatan", "Pasal 4-5, 11; Mengingat", "Penjelasan tambahan", "Kudus L4-5: rawat jalan ke dokter peserta 'BPJS Kesehatan CUG Djarum' (tidak dijelaskan)."], ["17", "Calon Karyawan Tetap", "", "Karyawan Bulanan yang sedang menjalani masa evaluasi atau percobaan dan belum dinyatakan sebagai karyawan tetap oleh Perusahaan.", "MCU", "Pasal 1 butir 3", "Definisi resmi SK", "Definisi sama di SK Kesehatan (Pasal 1 butir 4)."], ["18", "Calon Penerima Beasiswa", "", "Anak Karyawan yang diakui secara sah dari perkawinan yang tercatat dalam sistem kepegawaian Perusahaan.", "Beasiswa Anak", "Pasal 1 butir 5", "Definisi resmi SK", ""], ["19", "Cash Advance", "Kasbon", "Uang muka Perjalanan Dinas yang diajukan melalui Formulir Perjalanan Dinas kepada Finance dan dipertanggungjawabkan.", "Perjalanan Dinas", "Pasal 1; Pasal 5", "Definisi resmi SK", ""], ["20", "Competency Based Human Resources Management", "CBHRM", "Sistem pengelolaan SDM yang berbasis pada Kompetensi sebagai acuan utama dalam seluruh proses rekrutmen, pengembangan, penilaian kinerja, dan pengelolaan karir Karyawan agar selaras dengan kebutuhan Perusahaan.", "Premi; Pelatihan", "Premi Pasal 1 butir 6; Pelatihan Pasal 1 butir 6", "Definisi resmi SK", ""], ["21", "Direktur Departemen", "", "Pejabat yang memberi persetujuan pemeriksaan penunjang, tindakan medis, dan ijin dokter spesialis.", "Kesehatan", "Pasal 7; Lampiran II", "Penjelasan tambahan", "Kantor Perwakilan–Service Center: Head of District Sales / Head of Area Office / Direktur Departemen."], ["22", "Dokter Perusahaan", "", "Dokter yang ditunjuk oleh Perusahaan untuk melakukan pemeriksaan kesehatan.", "Kesehatan", "Pasal 1 butir 10", "Definisi resmi SK", ""], ["23", "Driver Truk", "Driver", "Karyawan yang ditugaskan Perusahaan untuk mengemudikan kendaraan operasional berupa truk dalam rangka kegiatan distribusi.", "UTH Driver", "Pasal 1 butir 3", "Definisi resmi SK", ""], ["24", "Electric Vehicle", "EV", "Kendaraan listrik; jenis Kendaraan Inventaris/Operasional yang mendapat fasilitas wall charger, pengisian daya di kantor, dan/atau reimburse SPKLU.", "Kend. Inventaris; Kend. Operasional", "Inventaris Pasal 3; Operasional Pasal 2 ayat 4", "Penjelasan tambahan", "Lawan: Non-Electric Vehicle (BBM)."], ["25", "Enterprise Solutions (ESD)", "ESD", "Bagian/fungsi IT Perusahaan yang memberi persetujuan atas software yang akan dipakai pada notebook dan melakukan pengaturan/konfigurasi notebook ke jaringan kantor.", "NOP", "Pasal 2 ayat 1c; Lampiran II", "Penjelasan tambahan", "Tidak didefinisikan di SK; fungsi dirangkum dari pasal dan flowchart."], ["26", "Fasilitas Pinjaman", "", "Fasilitas pembiayaan berupa pinjaman yang diberikan oleh Koperasi kepada Karyawan yang telah memenuhi persyaratan sesuai Ketentuan Koperasi dan Surat Keputusan ini.", "Pinjaman", "Pasal 1 butir 5", "Definisi resmi SK", ""], ["27", "Formulir Perjalanan Dinas", "", "Formulir pengajuan Perjalanan Dinas dan Cash Advance.", "Perjalanan Dinas", "Pasal 1; Pasal 5", "Definisi resmi SK", ""], ["28", "General Medical Check Up (GMCU)", "GMCU / MCU", "Pemeriksaan dokter dan pemeriksaan penunjang lainnya, tanpa indikasi medis, untuk melakukan deteksi dini munculnya penyakit.", "MCU", "Pasal 1 butir 6", "Definisi resmi SK", ""], ["29", "General Services", "GS", "Bagian yang mengadakan, mengelola, dan mendistribusikan seragam; mengonfirmasi seragam rusak; serta menerima pengembalian kendaraan inventaris/operasional.", "Seragam; Kend. Inventaris; Kend. Operasional", "Seragam Pasal 2-4; Kendaraan Pasal 6 / Pasal 4", "Penjelasan tambahan", "Tidak didefinisikan di SK."], ["30", "Handsock Decker (Manset Tangan)", "", "Manset penutup tangan yang boleh dipakai karyawati yang tidak menerima seragam, bersama kerudung, dengan memperhatikan kerapihan dan kesopanan.", "Seragam", "Pasal 2 ayat 6b", "Penjelasan tambahan", ""], ["31", "Head of District Services", "", "Jabatan Kepala Servis yang tercatat di HRIS; terdiri atas Head of District Services Sub dan Perwakilan (Tunjangan Jabatan berbeda).", "Skema Teknisi", "Pasal 1 butir 6; Lampiran (a)", "Penjelasan tambahan", "Padanan bahasa Inggris dari Kepala Servis sesuai Pasal 1 butir 6."], ["32", "Helper Truk", "Helper", "Karyawan yang ditugaskan Perusahaan untuk membantu Driver Truk dalam kegiatan operasional, termasuk proses muat, bongkar, dan aktivitas pendukung lainnya.", "UTH Driver", "Pasal 1 butir 4", "Definisi resmi SK", ""], ["33", "High Season", "", "Periode musim ramai dengan batas akomodasi perjalanan dinas di China lebih tinggi (RMB 400/malam vs RMB 300 normal). Dalam SK Perjalanan Dinas: batas akomodasi dalam negeri lebih tinggi saat musim ramai (ditentukan General Services).", "China; Perjalanan Dinas", "Butir 5; Perjalanan Dinas Lampiran I", "Penjelasan tambahan", ""], ["34", "HR Operations", "", "Bagian HR yang mengirim data karyawan yang akan pensiun dalam 2 bulan ke depan ke Direksi dan mengisi identitas karyawan pada formulir penghargaan masa bakti.", "Masa Bakti", "Butir 2; Lampiran I", "Penjelasan tambahan", ""], ["35", "HRIS (Data Kepegawaian)", "HRIS", "Sistem data kepegawaian Perusahaan yang menjadi acuan pencatatan jabatan Teknisi dan Kepala Servis.", "Skema Teknisi; Sales Promotor", "Pasal 1 butir 5-6", "Penjelasan tambahan", "Singkatan tidak diuraikan di SK; umumnya Human Resource Information System. Juga acuan pencatatan Kepala Perwakilan (SK Sales Promotor Pasal 1 ayat 6)."], ["36", "IIMS dan ISO", "IIMS; ISO", "Indonesia Index of Medical Specialities dan Indeks Spesialis Obat – daftar acuan obat; obat di luar daftar ini tidak ditanggung.", "Kesehatan", "Lampiran III butir 5", "Penjelasan tambahan", "Kepanjangan tercantum di SK."], ["37", "Ikatan Perjanjian", "", "Perjanjian antara Perusahaan dan karyawan/penerima program (Notebook, beasiswa, atau Pelatihan), di mana pihak tersebut mengikatkan diri sebagai peserta program.", "NOP; Beasiswa Karyawan; Beasiswa Anak; Pelatihan", "NOP Pasal 1 butir 5; Beasiswa Karyawan Pasal 1 butir 5; Beasiswa Anak Pasal 1 butir 9; Pelatihan Pasal 1 butir 11", "Definisi resmi SK", "Masa ikatan: NOP 3 th; Beasiswa Karyawan 1n–2n th; Beasiswa Plus 2 th; Pelatihan 1–3 th sesuai nominal. Masa ikatan tidak boleh dipersingkat/diperpanjang."], ["38", "Indeks Prestasi / IP Kumulatif", "IP; IPK", "Nilai akademik perguruan tinggi per semester (IP) dan kumulatif (IPK) yang menjadi syarat beasiswa.", "Beasiswa Anak", "Pasal 3 ayat 2d; Pasal 4 ayat 2", "Penjelasan tambahan", "Bakti: IP 3,25 (teknik) / 3,50 (non-teknik), IPK 3,00. Plus: IP 3,30."], ["39", "Insentif", "", "Bentuk pemberian penghargaan dalam bentuk uang yang diberikan kepada Karyawan di luar upah pokok Karyawan atas pekerjaan yang telah dilakukan.", "Sales Promotor", "Pasal 1 ayat 8", "Definisi resmi SK", "Insentif penugasan Rp50.000/orang/hari. Bandingkan Insentif Operasional & Insentif Reparasi."], ["40", "Insentif Operasional", "", "Sejumlah uang yang diberikan Perusahaan kepada Driver Truk dan Helper Truk di luar Uang Tambahan Harian, berdasarkan pelaksanaan Penugasan Operasional.", "UTH Driver", "Pasal 1 butir 8", "Definisi resmi SK", ""], ["41", "Insentif Reparasi", "", "Insentif yang diberikan Perusahaan kepada karyawan atas pencapaian hasil reparasi unit/produk selama suatu periode berdasarkan ketentuan Perusahaan.", "Skema Teknisi", "Pasal 1 butir 10", "Definisi resmi SK", ""], ["42", "Istri", "", "Perempuan yang secara sah menjadi pasangan dalam pernikahan dengan Karyawan menurut hukum.", "Kesehatan", "Pasal 1 butir 7", "Definisi resmi SK", "Ditanggung 1 orang; tidak tergantikan kecuali meninggal dunia atau cerai."], ["43", "JABODETABEK", "", "Wilayah Jakarta, Bogor, Depok, Tangerang, dan Bekasi; dipakai sebagai pembeda batas penggantian BBM Level 2.", "Kend. Inventaris", "Lampiran III", "Penjelasan tambahan", "Kepanjangan berdasarkan penggunaan umum."], ["44", "Job Title Code", "", "Kode numerik jabatan yang dipakai pada daftar posisi penerima Premi (737, 740, 742, 745, 747 – R&D Electric Vehicle).", "Premi", "Lampiran I", "Penjelasan tambahan", ""], ["45", "Kantor Perwakilan", "", "Kantor yang mewakili Perusahaan dalam urusan distribusi barang, penjualan, dan jasa servis.", "Skema Teknisi; Sales Promotor", "Pasal 1 butir 2", "Definisi resmi SK", "Definisi sama di SK Sales Promotor (Pasal 1 ayat 2)."], ["46", "Karyawan", "", "Setiap karyawan Perusahaan yang tercatat aktif di dalam sistem kepegawaian Perusahaan.", "Pinjaman", "Pasal 1 butir 2", "Definisi resmi SK", "Definisi yang sama dipakai di hampir semua SK: UTH Driver, Seragam, Kend. Inventaris, Kend. Operasional, Shift, Kesehatan, Premi, Beasiswa, Pelatihan, Komp. LK 2024, Sales Promotor."], ["47", "Karyawan Bulanan", "", "Karyawan dengan status bulanan yang terdiri dari Calon Karyawan Tetap dan Karyawan Tetap.", "MCU", "Pasal 1 butir 2", "Definisi resmi SK", "Definisi sama di SK Kesehatan (Pasal 1 butir 3) dan SK Shift (Pasal 1 butir 4)."], ["48", "Karyawan Harian", "", "Karyawan dengan status harian yang terdiri dari Calon Karyawan Tetap dan Karyawan Tetap.", "Shift; Tunjangan Masa Kerja", "Shift Pasal 1 butir 3; Masa Kerja Pasal 1 ayat 1", "Definisi resmi SK", "Sebelumnya tidak didefinisikan (SK Duka/Suka Cita Pasal 2-3: menerima sumbangan duka cita berupa uang dan ucapan suka cita untuk diri sendiri). Di SK Tunjangan Masa Kerja disebut 'Tetap maupun Kontrak'."], ["49", "Karyawan Kontrak", "", "Karyawan Harian berstatus kontrak yang ikut berhak atas Tunjangan Masa Kerja bila masa kerja min. 1 tahun.", "Tunjangan Masa Kerja", "Pasal 1 ayat 1", "Penjelasan tambahan", "Tidak didefinisikan sendiri di SK."], ["50", "Karyawan Tetap", "", "Karyawan (Bulanan) yang telah dinyatakan lulus masa evaluasi/percobaan dan dinyatakan sebagai karyawan tetap oleh Perusahaan.", "MCU", "Pasal 1 butir 4", "Definisi resmi SK", "Definisi serupa di SK Teknisi (Pasal 1 butir 4), Kesehatan, Premi, Beasiswa Karyawan, dan Beasiswa Anak."], ["51", "Karyawan Tidak Tetap", "", "Karyawan yang sedang menjalani masa evaluasi dan belum dinyatakan sebagai karyawan tetap oleh Perusahaan.", "Skema Teknisi", "Pasal 1 butir 3", "Definisi resmi SK", "Teknisi baru berstatus ini selama 6 bulan."], ["52", "Kategori Hasil Penilaian (S/A/B/C)", "", "Kategori hasil penilaian kompetensi yang menentukan kuota dan besaran Premi; kuota A 20%, B 30%, C 50% per Job Title (dibulatkan ke atas), S ditentukan manajemen.", "Premi", "Lampiran II B", "Penjelasan tambahan", ""], ["53", "Kegiatan Operasional", "", "Aktivitas yang berkaitan dengan pengiriman, distribusi, pengangkutan barang, atau kegiatan lain yang ditetapkan Perusahaan.", "UTH Driver", "Pasal 1 butir 5", "Definisi resmi SK", ""], ["54", "Kegiatan Pendukung", "", "Aktivitas yang dilakukan di luar jam kerja normal Karyawan serta di luar fungsi dan tanggung jawab utama yang telah ditetapkan bagi Karyawan.", "Sales Promotor", "Pasal 1 ayat 7", "Definisi resmi SK", "Harus dicantumkan di Surat Tugas."], ["55", "Kelompok Shift", "", "Pengelompokan jam kerja shift sebagai dasar besaran Tunjangan Kerja Shift: Shift II (sore–malam), Shift III (malam–dini hari), Shift Panjang (± 12–14 jam malam).", "Shift", "Pasal 2", "Penjelasan tambahan", "Shift II Rp3.000; Shift III Rp4.000; Shift Panjang Rp4.500 per hari."], ["56", "Keluarga", "", "Istri dan Anak Karyawan yang diakui secara sah menurut hukum.", "Kesehatan", "Pasal 1 butir 6", "Definisi resmi SK", "Ditanggung hanya untuk Karyawan Tetap pria: 1 istri + anak ke-1 s.d. 3."], ["57", "Kendaraan Inventaris", "", "Kendaraan milik Perusahaan yang penggunaannya diberikan kepada Karyawan pada Level Jabatan tertentu secara melekat berdasarkan penetapan Perusahaan.", "Kend. Inventaris", "Pasal 1 butir 4", "Definisi resmi SK", "Level 1-2: Polytron G3+, masa pakai 5 tahun."], ["58", "Kendaraan Operasional", "", "Kendaraan milik Perusahaan yang penggunaannya diberikan kepada Karyawan untuk menunjang pelaksanaan tugas, fungsi, dan kegiatan operasional Perusahaan.", "Kend. Operasional", "Pasal 1 butir 3", "Definisi resmi SK", "Polytron G3, masa pakai 5 tahun; dilarang untuk kepentingan pribadi."], ["59", "Kepala Perwakilan", "Head of District Sales", "Karyawan yang bertanggung jawab mengelola dan mengawasi operasi serta kegiatan perwakilan atau cabang di lokasi/wilayah tertentu dan tercatat di HRIS sebagai Kepala Perwakilan (Head of District Sales).", "Sales Promotor", "Pasal 1 ayat 6", "Definisi resmi SK", "Menandatangani Surat Tugas."], ["60", "Kepala Servis", "", "Karyawan yang tercatat di data kepegawaian (HRIS) sebagai Kepala Servis (Head of District Services).", "Skema Teknisi", "Pasal 1 butir 6", "Definisi resmi SK", ""], ["61", "Ketentuan Koperasi", "", "Seluruh ketentuan, persyaratan, mekanisme, dan kebijakan yang ditetapkan dan diberlakukan Koperasi secara mandiri sesuai kewenangan dan ketentuan yang berlaku.", "Pinjaman", "Pasal 1 butir 4", "Definisi resmi SK", ""], ["62", "Kompetensi", "", "Kombinasi dari pengetahuan (knowledge), keterampilan (skills), dan sikap (attitudes) yang diperlukan untuk melaksanakan suatu tugas atau pekerjaan secara efektif dan efisien.", "Premi; Pelatihan", "Premi Pasal 1 butir 5; Pelatihan Pasal 1 butir 5", "Definisi resmi SK", ""], ["63", "Koperasi", "", "Koperasi yang ditunjuk Perusahaan untuk menyediakan dan mencairkan Fasilitas Pinjaman Dana kepada Karyawan anggotanya.", "Pinjaman", "Pasal 2 ayat 1; Pasal 3 ayat 1a", "Penjelasan tambahan", "Tidak didefinisikan sendiri; dirangkum dari pasal-pasal terkait."], ["64", "Kurikulum", "", "Kerangka kerja atau rancangan terstruktur yang digunakan sebagai panduan dalam pelaksanaan program Pelatihan untuk mencapai tujuan pembelajaran tertentu.", "Pelatihan", "Pasal 1 butir 7; Pasal 3", "Definisi resmi SK", "Disusun per posisi berdasarkan kamus & matriks kompetensi."], ["65", "Laporan Pertanggungjawaban Perjalanan Dinas", "LPJ", "Laporan pertanggungjawaban biaya Perjalanan Dinas; maksimal 10 hari kerja setelah karyawan kembali.", "Perjalanan Dinas", "Pasal 1; Pasal 5", "Definisi resmi SK", ""], ["66", "Learning Management System", "LMS", "Sistem pembelajaran Perusahaan untuk mencatat jam pelatihan karyawan dan kontribusi SME sebagai fasilitator.", "Pelatihan", "Pasal 11", "Penjelasan tambahan", ""], ["67", "Level", "", "Kedudukan yang menunjukkan tingkatan tugas, tanggung jawab, dan wewenang di dalam Perusahaan.", "Kesehatan", "Pasal 1 butir 9", "Definisi resmi SK", "Sama dengan 'Level Jabatan' di SK lain."], ["68", "Level Jabatan", "", "Kedudukan yang menunjukkan tingkatan tugas, tanggung jawab, dan wewenang di dalam Perusahaan.", "NOP; Perjalanan Dinas", "Pasal 1 butir 2; Perjalanan Dinas Pasal 1 (Lampiran I & III per Level 1-7)", "Definisi resmi SK", "Definisi yang sama dipakai di SK GMCU, Kend. Inventaris, Beasiswa Karyawan, Beasiswa Anak, Pelatihan; SK Kesehatan memakai istilah 'Level'. Penetapan level mengacu SK No. 258/HRD/SK-Dir/IX/2017."], ["69", "Level of Authority (LoA)", "LoA", "Tingkat/dokumen kewenangan persetujuan yang berlaku di Perusahaan; dipakai untuk persetujuan Fasilitas Pinjaman Dana serta publikasi rencana, usulan, dan penunjukan fasilitator Pelatihan.", "Pinjaman; Pelatihan", "Pinjaman Pasal 3 ayat 1d, 2; Pelatihan Pasal 5-6, 8", "Penjelasan tambahan", "Tidak didefinisikan di SK; rincian LoA tidak tercantum."], ["70", "Masa Studi (n tahun)", "n", "Masa studi terhitung dari tanggal mulai studi hingga tanggal surat keterangan kelulusan dari Perguruan Tinggi; dasar perhitungan masa Ikatan Perjanjian beasiswa karyawan (1n atau 2n tahun).", "Beasiswa Karyawan", "Lampiran I (catatan **)", "Definisi resmi SK", ""], ["71", "Masa Tunggu", "", "Periode waktu tertentu yang harus dilalui sebelum karyawan dapat mengikuti Notebook Ownership Program kembali (tahun ke-4 setelah masa kepesertaan 3 tahun).", "NOP", "Pasal 1 butir 6; Pasal 4 ayat 2-3", "Definisi resmi SK", ""], ["72", "Non-Electric Vehicle", "", "Kendaraan berbahan bakar minyak; fasilitas penunjangnya berupa penggantian biaya bahan bakar dengan bukti pembayaran sah.", "Kend. Inventaris; Kend. Operasional", "Inventaris Pasal 4, Lamp. III; Operasional Pasal 2 ayat 5", "Penjelasan tambahan", "Level 2 Inventaris: maks. 250 L/bln (JABODETABEK) atau 150 L/bln (non-JABODETABEK)."], ["73", "Notebook", "", "Perangkat kerja yang dipergunakan karyawan untuk menunjang tugas dan kinerja karyawan pada Perusahaan.", "NOP", "Pasal 1 butir 3", "Definisi resmi SK", ""], ["74", "Notebook Ownership Program", "NOP", "Program kepemilikan Notebook bagi karyawan yang memenuhi ketentuan yang ditetapkan.", "NOP", "Pasal 1 butir 4", "Definisi resmi SK", "Bersifat penawaran, tidak wajib."], ["75", "Operasi Caesar", "SC (Sectio Caesarea)", "Persalinan dengan metode operasi; penggantian hanya bila ada pernyataan tertulis dokter bahwa persalinan alami membahayakan jiwa ibu/anak atau terdapat komplikasi.", "Kesehatan", "Pasal 6 ayat 3", "Penjelasan tambahan", "Kepanjangan 'SC' berdasarkan istilah medis umum."], ["76", "Pejabat Berwenang", "", "Individu yang ditunjuk dan bertanggung jawab untuk melakukan suatu tindakan dan pengambilan keputusan dalam Perusahaan.", "Premi; Perjalanan Dinas", "Pasal 1 butir 4; Perjalanan Dinas Pasal 1", "Definisi resmi SK", "Juga dipakai tanpa definisi di Skema Teknisi (mutasi) dan Sales Promotor (persetujuan Surat Tugas)."], ["77", "Pelatihan", "", "Proses pembelajaran yang terstruktur dan terencana untuk meningkatkan pengetahuan, keterampilan, dan kompetensi individu dalam suatu bidang tertentu.", "Pelatihan", "Pasal 1 butir 4", "Definisi resmi SK", ""], ["78", "Pelatihan Eksternal", "", "Program Pelatihan yang diselenggarakan oleh pihak di luar Perusahaan, seperti lembaga Pelatihan profesional, institusi pendidikan, atau organisasi sertifikasi.", "Pelatihan", "Pasal 1 butir 13", "Definisi resmi SK", ""], ["79", "Pelatihan Inhouse", "", "Pelatihan yang diselenggarakan bagian Human Resources dengan fasilitator dari lembaga pelatihan atau profesional eksternal sesuai standar Perusahaan.", "Pelatihan", "Pasal 4 ayat 2b", "Penjelasan tambahan", ""], ["80", "Pelatihan Internal", "", "Program Pelatihan yang diselenggarakan secara langsung oleh Perusahaan dengan memanfaatkan sumber daya internal, seperti tenaga ahli dari dalam Perusahaan atau materi yang disusun sesuai kebutuhan organisasi.", "Pelatihan", "Pasal 1 butir 12", "Definisi resmi SK", "Sub-jenis menurut penyelenggara: Internal Unit dan Inhouse."], ["81", "Pelatihan Internal Unit", "", "Pelatihan yang diselenggarakan masing-masing unit kerja dengan fasilitator internal untuk kebutuhan unit kerja.", "Pelatihan", "Pasal 4 ayat 2a", "Penjelasan tambahan", ""], ["82", "Pelatihan Publik", "", "Pelatihan yang diselenggarakan lembaga pelatihan eksternal dan diikuti Karyawan untuk memperoleh keterampilan yang relevan.", "Pelatihan", "Pasal 4 ayat 2c", "Penjelasan tambahan", ""], ["83", "Pemeriksaan Penunjang", "", "Pemeriksaan laboratorium, rontgen, USG, atau pemeriksaan lainnya yang dibutuhkan dokter untuk melakukan diagnosa karena adanya indikasi medis.", "Kesehatan", "Pasal 1 butir 12", "Definisi resmi SK", "Atas rujukan dokter, ijin online, dan persetujuan Direktur Departemen."], ["84", "Penalti Beasiswa", "", "Kewajiban membayar persentase total biaya beasiswa bila hubungan kerja berakhir sebelum masa ikatan selesai: < 1 th 100%, 1-<2 th 90%, 2-<3 th 80%, ≥ 3 th 70% (Beasiswa Karyawan); Beasiswa Plus s.d. 1-<2 th 90%.", "Beasiswa Karyawan; Beasiswa Anak", "Lampiran II masing-masing SK", "Penjelasan tambahan", "Karyawan yang gagal studi wajib mengembalikan biaya beasiswa."], ["85", "Penalti NOP", "", "Kewajiban membayar persentase dari plafon/harga yang dibayarkan bila karyawan mengundurkan diri sebelum masa kepesertaan berakhir (100% / 90% / 80% / 0% menurut masa kerja).", "NOP", "Pasal 4 ayat 1; Lampiran III", "Penjelasan tambahan", "Tidak didefinisikan; dirangkum dari pasal dan lampiran."], ["86", "Penalti Pelatihan", "", "Kewajiban bila hubungan kerja berakhir sebelum masa ikatan pelatihan selesai, dihitung (sisa masa ikatan bulan ÷ total masa ikatan bulan) × seluruh biaya pelatihan.", "Pelatihan", "Pasal 7 ayat 3; Lampiran I butir 2", "Penjelasan tambahan", "Masa ikatan: ≤ Rp10 jt 1 th; > Rp10-20 jt 2 th; > Rp20 jt 3 th."], ["87", "Penggantian Biaya Transportasi Pribadi", "", "Penggantian transport bagi penugasan dengan kendaraan pribadi, dihitung (total jarak km ÷ 25) × harga BBM per liter (acuan Pertamax atau setara).", "Sales Promotor", "Lampiran II butir 2", "Penjelasan tambahan", "Jarak diukur via Google Maps; transport umum sesuai kuitansi."], ["88", "Penghargaan Karyawan Pensiun", "", "Penghargaan non-uang yang diberikan Perusahaan kepada Karyawan yang memasuki masa pensiun, dikategorikan menurut masa kerja sejak tanggal bergabung.", "Penghargaan Pensiun", "Butir 1-2; Lampiran I", "Penjelasan tambahan", "Tidak ada nominal Rupiah; desain ditetapkan Perusahaan (Butir 3)."], ["89", "Penugasan Operasional", "", "Perintah kerja yang diberikan Perusahaan kepada Driver Truk dan/atau Helper Truk untuk melaksanakan Kegiatan Operasional.", "UTH Driver", "Pasal 1 butir 6", "Definisi resmi SK", ""], ["90", "Penyakit Kronis", "", "Penyakit kronis dan menahun (mis. cuci darah, ring jantung) yang penanganannya dijamin dan diprioritaskan melalui BPJS Kesehatan.", "Kesehatan", "Pasal 5", "Penjelasan tambahan", ""], ["91", "Perjalanan Dinas", "", "Penugasan karyawan ke luar lokasi kerja atas perintah Perusahaan, dalam negeri (≤150 KM atau >150 KM sekali tempuh) maupun luar negeri; diatur dalam SK Ketentuan Perjalanan Dinas (IX/26). Untuk karyawan di China ada batas biaya tersendiri (Memo China).", "Perjalanan Dinas; China; Komp. LK 2024", "Perjalanan Dinas Pasal 1-4; China butir 2, 5-6; Komp. LK Pasal 2 ayat 3", "Definisi resmi SK", "Rujukan SK berbeda: 067/ADM/SK-DIR/III/22 (Komp. LK 2024) dan 095/ADM-JKT/INT/X/24 (China)."], ["92", "Perjalanan Dinas Dalam Negeri", "", "Perjalanan Dinas di wilayah Indonesia; dibedakan ≤150 KM dan >150 KM sekali tempuh.", "Perjalanan Dinas", "Pasal 2; Pasal 3; Lampiran I", "Penjelasan tambahan", ""], ["93", "Perjalanan Dinas Luar Negeri", "", "Perjalanan Dinas ke luar wilayah Indonesia; memakai transportasi udara dan batas dalam USD.", "Perjalanan Dinas", "Pasal 2; Pasal 4; Lampiran III", "Penjelasan tambahan", ""], ["94", "Perjanjian Kerja Bersama", "PKB", "Perjanjian antara Perusahaan dan Pengurus SP.F. LEM SPSI Unit PT Hartono Istana Teknologi Group yang menjadi dasar peraturan Perusahaan.", "Duka/Suka Cita", "Mengingat", "Penjelasan tambahan", "Dirujuk pada SK Duka/Suka Cita, Skema Teknisi, UTH Driver, Seragam, Komp. LK 2024, Shift, Kend. Inventaris & Operasional; tidak didefinisikan."], ["95", "Persalinan dan Gugur Kandung", "", "Biaya melahirkan atau keguguran yang diganti s.d. kelahiran anak ketiga (dokter/bidan, kamar ibu & bayi, tindakan, obat), dengan batas hari perawatan tertentu.", "Kesehatan", "Pasal 6; Lampiran I butir 5-6", "Penjelasan tambahan", "Maks. hari: normal 5, SC 6, keguguran 1."], ["96", "Perusahaan", "", "PT Hartono Istana Teknologi beserta afiliasinya.", "NOP", "Pasal 1 butir 1", "Definisi resmi SK", "'PT HIT beserta afiliasinya' di sebagian besar SK. 'PT HIT dan PT Sarana Kencana Mulya' di SK Seragam (2025) dan Komp. LK 2024. 'PT Sarana Kencana Mulya' saja di Skema Teknisi (2022) dan Komp. LK 2021."], ["97", "Piagam", "", "Kategori penghargaan pensiun untuk Karyawan dengan masa kerja kurang dari 15 tahun.", "Penghargaan Pensiun", "Lampiran I", "Penjelasan tambahan", ""], ["98", "Pihak Ketiga", "", "Pihak yang terikat perjanjian kerja sama dengan Perusahaan dalam pengadaan tenaga kerja.", "Sales Promotor", "Pasal 1 ayat 3", "Definisi resmi SK", ""], ["99", "Plafon (Plafond)", "", "Batas maksimal penggantian biaya dalam satu periode; untuk Calon Karyawan Tetap ditetapkan per tahun (acuan tanggal bergabung) sesuai level.", "Kesehatan; NOP", "Kesehatan Lampiran I butir 1; NOP Lampiran I", "Penjelasan tambahan", "Kesehatan L1 Rp25 jt s.d. L5 Rp6 jt; NOP Rp17 jt."], ["100", "Plakat A", "", "Kategori penghargaan pensiun untuk Karyawan dengan masa kerja lebih dari 30 tahun.", "Penghargaan Pensiun", "Lampiran I", "Penjelasan tambahan", ""], ["101", "Plakat B", "", "Kategori penghargaan pensiun untuk Karyawan dengan masa kerja 15 sampai 30 tahun.", "Penghargaan Pensiun", "Lampiran I", "Penjelasan tambahan", ""], ["102", "Pocket Modem/Router Wi-Fi", "", "Perangkat internet portabel yang disediakan Perusahaan untuk Perjalanan Dinas luar negeri.", "Perjalanan Dinas", "Pasal 4; Lampiran III", "Penjelasan tambahan", ""], ["103", "Polytron Service Representative", "PSR", "Kantor/titik layanan servis Polytron tempat karyawan ditempatkan; karyawan PSR yang ke luar kota atau ditempatkan di luar daerah asal berhak atas kompensasi luar kota.", "Komp. LK 2024; Komp. LK 2021", "Pasal 2 ayat 1; Memo butir 3b", "Penjelasan tambahan", "Memo 2021: Tunjangan Penempatan tidak berlaku bagi karyawan rekrutmen lokal di PSR tersebut."], ["104", "Premi", "", "Penghargaan dalam bentuk uang yang diberikan oleh Perusahaan kepada Karyawan atas keahlian yang dimiliki dan dibutuhkan dalam pelaksanaan tugas jabatannya.", "Premi", "Pasal 1 butir 8", "Definisi resmi SK", "S Rp1,5 jt; A Rp1 jt; B Rp700 rb; C Rp400 rb per bulan."], ["105", "Program Sertifikasi / Non Sertifikasi", "", "Klasifikasi pelatihan menurut tujuan: Sertifikasi untuk memperoleh sertifikat keahlian sesuai standar internal/eksternal; Non Sertifikasi untuk peningkatan pengetahuan & keterampilan tanpa ujian sertifikasi.", "Pelatihan", "Pasal 4 ayat 1", "Penjelasan tambahan", ""], ["106", "Project Assignment", "", "Tugas proyek yang dikerjakan dan dipresentasikan peserta sebagai evaluasi implementasi pengetahuan dan keterampilan hasil pelatihan.", "Pelatihan", "Pasal 10 ayat 1c", "Penjelasan tambahan", "Bersama pre-test/post-test dan evaluasi penerapan di tempat kerja."], ["107", "Rawat Inap", "", "Perawatan dengan menginap di rumah sakit; penggantian meliputi kamar perawatan dan biaya di luar kamar (dokter, obat, penunjang, tindakan, kamar operasi, ICU/ICCU), dengan BPJS Kesehatan dimanfaatkan lebih dahulu.", "Kesehatan", "Pasal 4; Lampiran I", "Penjelasan tambahan", "Standar kamar per kota & level: sheet 'Kesehatan - Plafon & Kamar' di Rangkuman_SK."], ["108", "Rawat Jalan", "", "Pemeriksaan dan pengobatan tanpa menginap; penggantian meliputi dokter, administrasi, obat, pemeriksaan penunjang, tindakan medis, kamar perawatan sementara dan kamar operasi bila dibutuhkan.", "Kesehatan", "Pasal 3; Lampiran I & II", "Penjelasan tambahan", "Karyawan 100%; Keluarga L1-3 90%, L4-5 75%."], ["109", "Reimbursement", "", "Permohonan penggantian biaya yang dikeluarkan karyawan atas pemeriksaan General Medical Check Up yang telah dilakukan. Dalam SK Perjalanan Dinas: penggantian biaya perjalanan dinas yang dikeluarkan karyawan, diajukan maks 10 hari kerja.", "MCU; Perjalanan Dinas", "Pasal 1 butir 7; Perjalanan Dinas Pasal 1 & 5", "Definisi resmi SK", "Mekanisme reimbursement juga dipakai di SK Sales Promotor (transport), Beasiswa Anak (Beasiswa Plus), dan Kend. Inventaris/Operasional (pengisian daya SPKLU)."], ["110", "Rekognisi Pembelajaran Lampau", "RPL", "Jalur seleksi pendidikan tinggi yang mengakui pengalaman kerja/pembelajaran sebelumnya; masa ikatan beasiswa karyawan jalur RPL 2n tahun.", "Beasiswa Karyawan", "Lampiran I", "Definisi resmi SK", "Kepanjangan tercantum di catatan kaki Lampiran I."], ["111", "Rencana Pelatihan Tahunan", "", "Panduan terstruktur yang disusun untuk mengatur dan menjadwalkan program Pelatihan yang akan dilaksanakan dalam periode satu tahun.", "Pelatihan", "Pasal 1 butir 8; Pasal 5", "Definisi resmi SK", "Disusun HR dari analisis kesenjangan kompetensi."], ["112", "Renminbi", "RMB", "Mata uang Tiongkok yang dipakai untuk batas biaya makan (RMB 120/hari) dan akomodasi perjalanan dinas di China.", "China", "Butir 5", "Penjelasan tambahan", ""], ["113", "Rumus BBM/EV", "", "Penggantian kendaraan pribadi: BBM = (KM akhir − KM awal)/7 × harga BBM per liter; EV = (KM akhir − KM awal)/5 × harga listrik per KWH (acuan SPKLU PLN).", "Perjalanan Dinas", "Lampiran II", "Penjelasan tambahan", ""], ["114", "Sales Promotor", "", "Tenaga kerja dari Pihak Ketiga yang ditugaskan melakukan pemasaran dan penjualan produk atau barang dengan merek dagang Polytron.", "Sales Promotor", "Pasal 1 ayat 4", "Definisi resmi SK", "Tidak boleh dilibatkan dalam Kegiatan Pendukung."], ["115", "Seragam Kaos Kerah Commercial", "", "Seragam kaos berkerah untuk fungsi Commercial; 3 pcs sejak bergabung, diganti 1 tahun sekali.", "Seragam", "Lampiran I & II", "Penjelasan tambahan", "Satu-satunya seragam dengan periode penggantian 1 tahun."], ["116", "Seragam Kerja", "", "Pakaian yang secara khusus dirancang dan diberikan kepada Karyawan dalam sebuah Perusahaan untuk dipakai sebagai representasi dari identitas dan citra Perusahaan.", "Seragam", "Pasal 1 ayat 3", "Definisi resmi SK", "Jenis: Wearpack, PDL, PDL Pemadam, Safari, Driver, Kaos Kerah Commercial."], ["117", "Seragam PDL / PDL Pemadam", "PDL", "Jenis seragam kerja (beserta varian untuk petugas pemadam) yang diberikan 3 pcs sejak bergabung, diganti 2 tahun sekali, dengan aksesoris kaos dalam, kaos kaki, sepatu, ikat pinggang dalam, kopel, topi/baret, peluit, tali kur.", "Seragam", "Lampiran I & II", "Penjelasan tambahan", "Singkatan PDL tidak diuraikan di SK (umumnya Pakaian Dinas Lapangan)."], ["118", "Sistem Medical", "", "Sistem tempat karyawan menginput tagihan pengajuan penggantian biaya kesehatan.", "Kesehatan", "Pasal 10 ayat 1", "Penjelasan tambahan", "Batas pengajuan 30 hari kalender sejak tanggal kuitansi."], ["119", "SKKNI (Standar Kompetensi Kerja Nasional Indonesia)", "SKKNI", "Standar kompetensi kerja nasional yang wajib dimiliki seluruh Teknisi atau kebutuhan lain yang dipersyaratkan; karyawan yang belum memiliki dibekali pelatihan kompetensi dengan biaya Perusahaan.", "Skema Teknisi", "Pasal 1 butir 7-8", "Penjelasan tambahan", "Singkatan tidak diuraikan di SK; uraian lengkap berdasarkan penggunaan umum."], ["120", "Standar Biaya Kamar Perawatan", "", "Batas maksimal dasar penggantian biaya kamar rawat inap per kota dan level, dikalikan persentase penggantian Karyawan/Keluarga.", "Kesehatan", "Lampiran I butir 3-4", "Penjelasan tambahan", "Bila kamar melebihi standar, persentase penggantian biaya non-kamar turun (Karyawan 85%)."], ["121", "Stasiun Pengisian Kendaraan Listrik Umum", "SPKLU", "Stasiun pengisian daya kendaraan listrik untuk umum; biaya pengisian dapat diajukan penggantiannya dengan bukti pembayaran sah.", "Kend. Operasional; Kend. Inventaris", "Operasional Pasal 2 ayat 4; Inventaris Lamp. II", "Penjelasan tambahan", "Kepanjangan disebut di SK Operasional. Inventaris: hanya Level 1."], ["122", "Subject Matter Expert", "SME", "Individu yang memiliki pengetahuan, keterampilan, atau keahlian yang mendalam dalam bidang atau topik tertentu.", "Pelatihan", "Pasal 1 butir 10; Pasal 8, 11", "Definisi resmi SK", "Kontribusi sebagai fasilitator dicatat di LMS."], ["123", "Sumbangan Duka Cita", "", "Pemberian dari Perusahaan kepada karyawan dan keluarga intinya karena adanya keadaan meninggal dunia.", "Duka/Suka Cita", "Pasal 1 butir 1", "Definisi resmi SK", ""], ["124", "Sumbangan Pembinaan Pendidikan", "SPP", "Biaya pendidikan yang ditanggung Beasiswa Plus bersama Biaya Pengembangan Fasilitas dan Biaya Non-SPP, dibayar langsung ke institusi atau via reimbursement.", "Beasiswa Anak", "Pasal 6 ayat 1", "Penjelasan tambahan", ""], ["125", "Surat Peringatan", "SP", "Sanksi administratif berupa SP I, SP II, atau SP III yang diterbitkan Perusahaan dan masih berlaku secara sah.", "Pinjaman", "Pasal 1 butir 7", "Definisi resmi SK", "Tidak sedang menerima SP juga menjadi syarat SK Beasiswa Anak (Pasal 2 ayat 1a)."], ["126", "Surat Tanda Nomor Kendaraan", "STNK", "Dokumen registrasi kendaraan; biaya perpanjangannya ditanggung Perusahaan untuk Kendaraan Inventaris dan Operasional.", "Kend. Inventaris; Kend. Operasional", "Inventaris Pasal 5 ayat 1c; Operasional Pasal 3 ayat 1c", "Penjelasan tambahan", ""], ["127", "Surat Tugas", "", "Dokumen penugasan ke luar lokasi kerja yang ditandatangani Kepala Perwakilan, memuat nama/jadwal/lokasi kegiatan serta daftar petugas (NIK, nama, store/showroom, jarak, tanggal, waktu, keterangan).", "Sales Promotor", "Pasal 2; Lampiran I", "Penjelasan tambahan", "Wajib dilampirkan pada reimbursement transport."], ["128", "Teknisi", "Technician", "Karyawan yang tercatat di data kepegawaian (HRIS) sebagai Teknisi (Technician).", "Skema Teknisi", "Pasal 1 butir 5", "Definisi resmi SK", ""], ["129", "Tindakan Medis", "", "Tindakan yang dilakukan oleh dokter untuk pengobatan (seperti bedah, infus, injeksi) dan pemulihan (seperti fisioterapi).", "Kesehatan", "Pasal 1 butir 13", "Definisi resmi SK", ""], ["130", "Tolak (Pergi-Pulang)", "", "Perjalanan luar kota yang dilakukan pergi dan pulang di hari yang sama tanpa menginap; dasar Tunjangan Luar Kota tarif harian terendah.", "Komp. LK 2024", "Lampiran I", "Penjelasan tambahan", "Lawan: menginap."], ["131", "Total Angsuran", "", "Jumlah keseluruhan kewajiban pembayaran bulanan Karyawan kepada Perusahaan yang diperhitungkan dan dipotong langsung dari Upah Pokok oleh Perusahaan.", "Pinjaman", "Pasal 1 butir 6", "Definisi resmi SK", "Batas maksimal 30% dari Upah Pokok (Pasal 3 ayat 1c)."], ["132", "Transportasi", "", "Sarana perjalanan (udara, darat, sungai/laut) beserta BBM, parkir, tol dan transportasi umum yang diganti sesuai ketentuan.", "Perjalanan Dinas", "Pasal 1; Pasal 3; Pasal 4; Lampiran I-III", "Definisi resmi SK", ""], ["133", "Tunjangan", "", "Bentuk pemberian tambahan dalam bentuk uang atau manfaat lainnya yang diberikan kepada Karyawan di luar upah pokok Karyawan.", "Komp. LK 2024", "Pasal 1 ayat 3", "Definisi resmi SK", ""], ["134", "Tunjangan Jabatan", "", "Tunjangan yang diberikan Perusahaan kepada karyawan yang menduduki posisi tertentu.", "Skema Teknisi", "Pasal 1 butir 11", "Definisi resmi SK", ""], ["135", "Tunjangan Kemahalan", "", "Tunjangan yang diberikan kepada karyawan yang ditugaskan bekerja di lokasi berbeda dari penempatan asal tanpa jangka waktu (permanen), atas persetujuan Pejabat Berwenang dan demi kepentingan Perusahaan.", "Skema Teknisi", "Pasal 1 butir 13", "Definisi resmi SK", "Tidak berlaku bila Perusahaan menyediakan tempat tinggal (Pasal 5 ayat 4)."], ["136", "Tunjangan Kerja Shift", "", "Bagian dari komponen upah yang berupa tunjangan tidak tetap, diberikan kepada Karyawan yang bekerja dengan sistem kerja shift baik Karyawan Harian maupun Karyawan Bulanan.", "Shift", "Pasal 1 butir 5-7", "Definisi resmi SK", "Dihitung per hari per kelompok shift; dibayar bersama gaji bulan berjalan."], ["137", "Tunjangan Lokasi", "", "Tunjangan yang diberikan kepada karyawan yang ditugaskan bekerja di lokasi ber-UMK lebih tinggi dari UMK penempatan asal, atas persetujuan Pejabat Berwenang dan demi kepentingan Perusahaan.", "Skema Teknisi", "Pasal 1 butir 12", "Definisi resmi SK", ""], ["138", "Tunjangan Luar Kota", "", "Bentuk pemberian tambahan dalam bentuk uang yang diberikan kepada Karyawan yang melakukan perjalanan luar kota.", "Komp. LK 2024", "Pasal 1 ayat 4", "Definisi resmi SK", "Rp20.000/hari (tolak/pergi-pulang); Rp70.000/hari (menginap). Versi 2021: Rp15.000 / Rp60.000."], ["139", "Tunjangan Masa Kerja", "", "Bagian dari komponen upah berupa tunjangan tetap, diberikan kepada Karyawan Harian (Tetap maupun Kontrak) yang bekerja min. 1 tahun, dihitung per hari atau 30 hari dalam sebulan dan dibayar bersamaan dengan gaji bulan berjalan.", "Tunjangan Masa Kerja", "Pasal 1 ayat 1-4", "Definisi resmi SK", "Rp150/hari (Rp4.500/bln) pada 1 tahun, +Rp150/hari tiap tahun, maks. Rp4.500/hari (Rp135.000/bln) pada 30 tahun."], ["140", "Tunjangan Penempatan", "", "Bentuk pemberian tambahan dalam bentuk uang yang diberikan kepada Karyawan yang ditugaskan untuk penempatan di luar kota.", "Komp. LK 2024", "Pasal 1 ayat 5; Pasal 2 ayat 4", "Definisi resmi SK", "Rp500.000/bulan, khusus PSR, masa penugasan min. 1 bulan; Technician & Driver."], ["141", "Tunjangan Perjalanan Dinas", "", "Tunjangan harian selama Perjalanan Dinas >150 KM/luar negeri: Rp20.000/hari (Level 3-7, dalam negeri); USD 5/hari (Level 2-7, luar negeri).", "Perjalanan Dinas", "Pasal 1; Lampiran I & III", "Definisi resmi SK", ""], ["142", "Tunjangan Tetap", "", "Jenis tunjangan yang menjadi bagian komponen upah tetap; di SK ini Tunjangan Masa Kerja digolongkan sebagai tunjangan tetap.", "Tunjangan Masa Kerja", "Pasal 1 ayat 1", "Penjelasan tambahan", "Kebalikan 'tunjangan tidak tetap' (Tunjangan Kerja Shift)."], ["143", "Tunjangan Transport", "", "Tunjangan bagi Karyawan Level 2 penerima Kendaraan Inventaris EV sebagai pengganti fasilitas pengisian daya (Rp1.500.000).", "Kend. Inventaris", "Lampiran II", "Penjelasan tambahan", "Periode pembayaran tidak disebut di SK."], ["144", "Uang Operasional Kendaraan", "", "Sejumlah uang yang diberikan Perusahaan untuk mendukung kebutuhan operasional selama Penugasan Operasional, untuk membiayai pengeluaran yang berkaitan dengan kelancaran operasional.", "UTH Driver", "Pasal 1 butir 9; Pasal 4", "Definisi resmi SK", "Mencakup pungutan lapangan, parkir, retribusi, perawatan ringan, dan biaya lain."], ["145", "Uang Penghargaan Masa Bakti", "", "Penghargaan yang dapat diberikan kepada Karyawan Bulanan dengan masa kerja min. 20 tahun yang mengakhiri masa kerja karena pensiun atau perpanjangannya; besarannya diputuskan manajemen dan bukan hak karyawan.", "Masa Bakti", "Butir 3-4", "Penjelasan tambahan", "Usulan via formulir HR 185 R0 (Direksi -> COO -> CEO)."], ["146", "Uang Tambahan Harian", "UTH", "Sejumlah uang yang diberikan Perusahaan kepada Driver Truk dan Helper Truk sebagai tambahan berdasarkan pelaksanaan Kegiatan Operasional; diberikan per hari dan bersifat tidak tetap.", "UTH Driver", "Pasal 1 butir 7; Pasal 2 ayat 1", "Definisi resmi SK", ""], ["147", "Ucapan Suka Cita", "", "Pemberian dari Perusahaan kepada karyawan dan keluarga intinya karena adanya pernikahan.", "Duka/Suka Cita", "Pasal 1 butir 2", "Definisi resmi SK", "Berbentuk karangan bunga."], ["148", "Upah", "", "Hak Karyawan yang diterima dan dinyatakan dalam bentuk uang sebagai imbalan dari pengusaha atau pemberi kerja kepada Karyawan yang ditetapkan dan dibayarkan menurut perjanjian kerja, kesepakatan atau peraturan perundang-undangan.", "Premi", "Pasal 1 butir 7", "Definisi resmi SK", "Bandingkan 'Upah Pokok' (SK Pinjaman)."], ["149", "Upah Minimum Kota/Kabupaten", "UMK", "Upah terendah di suatu Kota/Kabupaten yang ditetapkan oleh Pemerintah Daerah.", "Skema Teknisi", "Pasal 1 butir 9", "Definisi resmi SK", "Menjadi dasar Tunjangan Lokasi."], ["150", "Upah Pokok", "", "Hak Karyawan yang diterima dan dinyatakan dalam bentuk uang sebagai imbalan dari Perusahaan atas pekerjaan atau jasa yang telah atau akan dilakukan.", "Pinjaman", "Pasal 1 butir 3", "Definisi resmi SK", "Dasar perhitungan batas Total Angsuran dan pemotongan angsuran. Bandingkan 'Upah' (SK Premi)."], ["151", "Usulan Pelatihan", "", "Rekomendasi atau proposal yang diajukan untuk menyelenggarakan program Pelatihan dengan tujuan meningkatkan Kompetensi, keterampilan, atau pengetahuan individu Karyawan.", "Pelatihan", "Pasal 1 butir 9; Pasal 6", "Definisi resmi SK", "Diajukan bagian/unit kerja sesuai LoA; diverifikasi HR."], ["152", "Wall Charger", "", "Perangkat pengisi daya kendaraan listrik yang dipasang di rumah; diberikan 1 unit kepada penerima function genTable(rows,o={}){

    const s=$('select',{},$('option',{value:''},'Semua '+head[ci]),vals.map(v=>$('option',{value:v},v)));
    s.addEventListener('change',draw);sel[ci]=s;bar.append(s)});
  const cnt=$('span',{class:'cnt'});bar.append(cnt);root.append(bar);

sec('Benefit Rupiah','ben','Ringkasan Benefit',()=>{
  const root=$('div');root.append($('p',{class:'sub'},'Nilai per 1 penerima, dikutip dari SK. Estimasi per tahun = nilai × pengali; benefit harian memakai asumsi hari per bulan (ASUMSI, bukan dari SK). Jenis "Sekali" dan "Plafon" bukan penerimaan rutin tahunan.'));
  const bar=$('div',{class:'bar'});const q=$('input',{type:'search',placeholder:'Cari benefit…'});
  const kodes=[...new Set(D.items.map(i=>i.kode))];const sk=$('select',{},$('option',{value:''},'Semua SK'),kodes.map(k=>$('option',{value:k},k)));
  const jn=$('select',{},$('option',{value:''},'Semua jenis'),[...new Set(D.items.map(i=>i.jenis))].map(k=>$('option',{value:k},k)));
  const hi=$('input',{type:'number',min:1,max:31,value:HARI,class:'in',style:'width:70px'});
  bar.append(q,sk,jn,$('label',{},'Hari penerimaan / bulan: '),hi);const cnt=$('span',{class:'cnt'});bar.append(cnt);root.append(bar);
  const tw=$('div',{class:'tw'});root.append(tw);
  function draw(){const qq=q.value.trim(),nq=norm(qq);let n=0;const t=$('table');
    t.append($('thead',{},$('tr',{},['No','Kode SK','Nomor SK','Tahun SK','Benefit','Penerima / Kondisi','Nilai (Rp)','Satuan','Jenis','Pengali Tahunan','Estimasi per Tahun (Rp)','Dasar Hitung / Catatan'].map((h,i)=>$('th',{class:[6,9,10].includes(i)?'r':''},h)))));const tb=$('tbody');
    D.items.forEach((it,i)=>{if(sk.value&&it.kode!==sk.value)return;if(jn.value&&it.jenis!==jn.value)return;
      const m=mult(it);const est=m===null?'n/a':rp(it.nilai*m);
      const cells=[i+1,it.kode,it.nomor,it.tahun,it.benefit,it.penerima,rp(it.nilai),it.satuan,it.jenis,m===null?'':m,est,it.catatan];
      if(nq&&!cells.some(x=>norm(x).includes(nq)))return;n++;
      const tr=$('tr');cells.forEach((v,j)=>tr.append($('td',{class:[6,9,10].includes(j)?'r':(j===3?'c':''),html:hl(v,qq)})));tb.append(tr)});
    t.append(tb);tw.replaceChildren(t);cnt.textContent=n+' benefit'}
  q.oninput=sk.onchange=jn.onchange=draw;hi.oninput=()=>{HARI=Math.max(1,+hi.value||22);draw()};draw();return root});
sec('Benefit Rupiah','sim','Simulasi Inflasi',()=>{
  const root=$('div');root.append($('p',{class:'sub'},'Nilai benefit yang menjaga daya beli sejak SK ditetapkan. Inflasi dikalikan berantai mulai tahun SETELAH tahun SK hingga 2026. Nilai setara 2026 = Nilai SK × Π(1 + inflasi tahunan). Ubah kotak kuning untuk simulasi lain.'));
  const ib=$('div',{class:'bar'});const inputs=INF.map((x,i)=>{const e=$('input',{type:'number',step:'0.01',value:(x[1]*100).toFixed(2),class:'in',style:'width:80px'});e.oninput=()=>{INF[i][1]=(+e.value||0)/100;draw()};ib.append($('label',{},x[0]+': '),e,'% ');return e});
  root.append(ib,$('p',{class:'sub',id:'infsrc'},INF.map(x=>x[0]+' — '+x[2]).join('\n')));root.lastChild.style.whiteSpace='pre-line';
  const bar=$('div',{class:'bar'});const q=$('input',{type:'search',placeholder:'Cari benefit…'});const cnt=$('span',{class:'cnt'});bar.append(q,cnt);root.append(bar);
  const tw=$('div',{class:'tw'});root.append(tw);const years=INF.map(x=>x[0]);
  function draw(){const qq=q.value.trim(),nq=norm(qq);let n=0;const t=$('table');
    t.append($('thead',{},$('tr',{},['No','Kode SK','Benefit','Penerima / Kondisi','Tahun SK','Nilai pada SK (Rp)','Satuan',...years,'Faktor Kumulatif','Nilai Setara 2026 (Rp)','Selisih (Rp)','Selisih (%)','Est. Tahun – Nilai SK','Est. Tahun – Setara 2026'].map((h,i)=>$('th',{class:i>=5&&i!==6?'r':''},h)))));const tb=$('tbody');
    D.items.forEach((it,i)=>{if(nq&&![it.kode,it.benefit,it.penerima,it.tahun].some(x=>norm(x).includes(nq)))return;n++;
      let v=null;const ys=years.map(y=>{if(y<it.tahun)return'';if(y===it.tahun)v=it.nilai;else v=v*(1+INF.find(z=>z[0]===y)[1]);return rp(v)});
      const f=v/it.nilai,m=mult(it);
      const cells=[i+1,it.kode,it.benefit,it.penerima,it.tahun,rp(it.nilai),it.satuan,...ys,f.toFixed(4).replace('.',','),rp(v),rp(v-it.nilai),((f-1)*100).toFixed(1).replace('.',',')+'%',m===null?'n/a':rp(it.nilai*m),m===null?'n/a':rp(it.nilai*m*f)];
      const tr=$('tr');cells.forEach((c,j)=>tr.append($('td',{class:j>=5&&j!==6?'r':(j===4?'c':''),html:hl(c,qq)})));tb.append(tr)});
    t.append(tb);tw.replaceChildren(t);cnt.textContent=n+' benefit'}
  q.oninput=draw;draw();return root});
