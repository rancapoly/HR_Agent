*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}

"Pemberian Uang Tambahan Harian Driver dan Helper Truk dari Kudus dan Sayung", "1 Juli 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Memberi kejelasan skema, besaran, dan ketentuan uang tambahan harian bagi Driver dan Helper Truk yang mendukung distribusi dan pengiriman.", "Driver Truk dan Helper Truk (Kudus dan Sayung) yang menjalankan Penugasan Operasional.", "• UTH: per hari, tidak tetap, diberikan bila melaksanakan Penugasan Operasional; tidak berhak bila tidak bekerja sesuai tugas.\n• Hari libur: UTH 1,5x; Idul Fitri (2 hari), Natal, Tahun Baru: 2x UTH hari kerja biasa.\n• Bila ada tujuan tambahan setelah tujuan pertama, UTH dihitung berdasarkan tujuan terjauh.\n• Insentif Operasional: per hari, tidak tetap, untuk Driver/Helper Truk Gandeng/Non-Gandeng.\n• Uang Operasional Kendaraan (pungutan lapangan, parkir, retribusi, perawatan ringan, dll.) menjadi tanggung jawab Driver/Helper, baik terpakai maupun tidak.\n• BOP Balen: untuk muatan balen, dihitung dari jumlah muatan/kapasitas dan dapat mempertimbangkan lokasi/tujuan.\n• Besaran Insentif, Uang Operasional, BOP Balen ditetapkan Logistik (pertimbangan: kebutuhan operasional, kondisi lapangan, jenis kendaraan, tujuan, inflasi versi Finance) dan disetujui Head of Supply Chain Management.\n• Pembulatan ke atas kelipatan Rp5.000.", "UTH Luar Kota (siang/malam): Driver Rp70.000; Helper Rp50.000.\nUTH Dalam Kota (per hari): Driver Rp33.000; Helper Rp25.000.\nPengali: hari libur 1,5x; hari raya/Natal/Tahun Baru 2x.\nNominal Insentif Operasional, Uang Operasional Kendaraan, BOP Balen tidak tercantum (ditetapkan Logistik).", "UU No. 13/2003 jo. UU No. 11/2020 Cipta Kerja; Perjanjian Kerja Bersama (PKB); SK No. 210/HRD & GS/MAP/IX/2018 tentang UTH, Uang Tambahan, Uang Lain-lain, dan Uang BOP Balen Sopir dan Kernet Kendaraan Truk, Dutro, dan Kelas di Bawahnya dari Kudus dan Sayung.", "SK No. 210/HRD & GS/MAP/IX/2018 dicabut dan tidak berlaku.", "7 hal. (6 hal. dijelaskan di SK ini.", "Berlaku"], ["7", "Ketentuan Pemberian Kompensasi Luar Kota.pdf", "Memo No. 001/COM/SK-DIR/11/21 (dirujuk di SK 2024 sebagai 001/COM/SK-DIR/III/21)", "Ketetapan Pemberian Kompensasi Luar Kota", "5 Maret 2021", "Tekno Wibowo (Director of Commercial)", "PT Sarana Kencana Mulya", "Meninjau surat terdahulu No. 005/COM/SK-DIR/X/19 dan menyesuaikan dengan situasi dan kondisi saat itu.", "Karyawan dengan jenis pekerjaan tertentu (Sales Executive, Technician, Driver, Helper) yang bertugas ke luar kota / ditempatkan di PSR.", "• Tunjangan Luar Kota bagi jenis pekerjaan tertentu yang melakukan perjalanan ke luar kota untuk tugas/pekerjaan rutin.\n• Tunjangan Penempatan bagi karyawan yang ditempatkan di PSR (Polytron Service Representative) di luar daerah asal/rekrutmen, masa tugas min. 1 bulan; tidak berlaku bagi rekrutmen lokal di PSR tersebut.\n• Jenis pekerjaan penerima diatur di Lampiran 1.", "Tunj. Luar Kota tolak/pulang-pergi: Rp15.000/hari.\nTunj. Luar Kota menginap: Rp60.000/hari.\nTunj. Penempatan (khusus PSR): Rp500.000/bulan.", "Tidak dicantumkan (format memo).", "Peraturan lain yang mengatur hal yang sama tidak berlaku (meninjau No. 005/COM/SK-DIR/X/19).", "2 hal. (1 hal. memo + Lampiran 1).", "Versi lama. Dirujuk di 'Mengingat' Peraturan Direksi 040/ADM-JKT/INT/III/2024 sebagai No. 001/COM/SK-DIR/III/21. Besaran sudah diperbarui oleh peraturan 2024.", "Kemungkinan sudah tidak berlaku – digantikan Peraturan Direksi No. 040/ADM-JKT/INT/III/2024 (besaran baru)"], ["8", "Peraturan Direksi Pemberian Kompensasi Luar Kota (Signed).pdf (scan)", "Peraturan Direksi No. 040/ADM-JKT/INT/III/2024", "Pemberian Kompensasi Luar Kota", "1 Maret 2024", "Tekno Wibowo (Commercial Director)", "PT Hartono Istana Teknologi dan PT Sarana Kencana Mulya", "Memberikan kompensasi atas biaya tambahan yang timbul akibat tugas di luar (kota).", "Karyawan dengan penempatan di Polytron Service Representative (PSR) yang melakukan perjalanan ke luar kota / ditugaskan di luar daerah asal penempatan.", "• Tunjangan bagi Karyawan PSR yang ke luar kota untuk tugas/pekerjaan rutin; jenis tunjangan per jenis pekerjaan di Lampiran I.\n• Besaran tunjangan ditentukan Perusahaan (Lampiran I).\n• Fasilitas penginapan mengikuti SK No. 067/ADM/SK-DIR/III/22 tentang Ketentuan Perjalanan Dinas.\n• Tunjangan Penempatan bagi Karyawan yang ditugaskan di luar daerah asal penempatan dengan masa penugasan min. 1 bulan.\n• Sales Executive, Visual Merchandiser, Event Support, Helper: Tunjangan Luar Kota; Technician dan Driver: Tunjangan Luar Kota + Tunjangan Penempatan.", "Tunj. Luar Kota (tolak/pergi-pulang): Rp20.000/hari.\nTunj. Luar Kota (menginap): Rp70.000/hari.\nTunj. Penempatan (khusus PSR): Rp500.000/bulan.\nMasa penugasan min. untuk Tunj. Penempatan: 1 bulan.", "PKB; SK No. 067/ADM/SK-DIR/III/22 tentang Ketentuan Perjalanan Dinas; SK No. 001/COM/SK-DIR/III/21 tentang Ketetapan Pemberian Kompensasi Luar Kota.", "SK No. 214/ADM-JKT/INT/VII/2023 tentang Ketetapan Pemberian Kompensasi Luar Kota dicabut dan tidak berlaku.", "3 hal. (2 hal. batang tubuh + Lampiran I). File berupa scan – dibaca dengan OCR dan dicek visual.", "Huruf a 'Menimbang' terpotong ('tugas di luar;'). Rujukan Perjalanan Dinas masih SK 067/2022, padahal Memo China (Nov 2024) merujuk SK Perjalanan Dinas No. 095/ADM-JKT/INT/X/24.", "Berlaku"], ["9", "Memo Uang Penghargaan Masa Bakti (Signed).pdf", "Memo No. 049/ADM-JKT/INT/V/2024", "Ketetapan Pemberian Uang Penghargaan Masa Bakti", "1 Mei 2024", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Memberikan penghargaan kepada karyawan yang mengakhiri masa kerja karena pensiun maupun perpanjangannya.", "Karyawan Bulanan yang mengakhiri masa kerja karena pensiun atau berakhirnya perpanjangan pensiun.", "• HR Operations mengirim data karyawan yang akan pensiun/berakhir perpanjangannya dalam 2 bulan ke depan secara periodik ke Direksi.\n• Kriteria: tercatat Karyawan Bulanan; masa kerja min. 20 tahun sejak bergabung; perilaku dan kontribusi baik; direkomendasikan Direksi dengan formulir Lampiran I (Form HR 185 R0).\n• Besaran ditentukan sepenuhnya atas kesepakatan manajemen dengan mempertimbangkan kontribusi; bukan hak karyawan.\n• Alur formulir: diajukan Direksi -> diverifikasi COO -> disetujui CEO.", "Masa kerja minimum: 20 tahun.\nLead time data HR Operations: 2 bulan sebelum pensiun.\nNominal: tidak ditetapkan (usulan nominal/pengali upah aktual diisi Direksi di formulir).", "Tidak dicantumkan (format memo).", "Tidak ada yang dinyatakan dicabut.", "2 hal. (1 hal. memo + Lampiran I formulir).", "Nama file sudah diperbaiki menjadi 'Penghargaan' (sebelumnya 'Perhargaan'). Formulir bersifat RAHASIA.", "Berlaku"], ["10", "Pengumuman Penyesuaian Kebijakan Seragam.pdf (scan)", "Pengumuman No. 73/ADM-KDS/INT/VII/2024", "Penyesuaian Kebijakan Seragam Kerja", "15 Juli 2024 (Kudus)", "Hariono (jabatan tidak tercantum)", "Tidak disebutkan (kop PT Hartono Istana Teknologi)", "Hasil evaluasi berkala kebijakan dan pertimbangan faktor keamanan (pencegahan maupun penanggulangan).", "Karyawan bagian produksi dan seluruh karyawan penerima seragam.", "• Perusahaan tidak lagi menyediakan seragam produksi (Seragam Kemeja Biru dan Seragam Kaos Kerja – Lampiran II No. 1 & 2 Peraturan Direksi No. 203/ADM-JKT/INT/IX/23).\n• Seragam lain tetap disediakan.\n• Stok tersisa tetap diberikan kepada yang membutuhkan hingga habis; penerima wajib memakainya selama waktu kerja.\n• Karyawan tanpa seragam wajib berpakaian kerja sopan, rapi, sesuai etika dan norma.", "Tidak ada angka/nominal.", "Tidak dicantumkan.", "Mengubah sebagian Peraturan Direksi No. 203/ADM-JKT/INT/IX/23 (Lampiran II No. 1-2).", "1 hal.; tanpa lampiran. File berupa scan – dibaca dengan OCR dan dicek visual.", "SK 203/23 yang diubah pengumuman ini telah dicabut oleh Keputusan Direksi No. 001/ADM-JKT/INT/XII/25; Lampiran I SK baru tidak lagi memuat seragam produksi sehingga substansi pengumuman sudah terserap.", "Perlu konfirmasi – dasar rujukannya (SK 203/23) sudah dicabut oleh SK Seragam 2025"], ["11", "Ketentuan Pemeliharaan Kesehatan bagi Karyawan Lv 1 - 5.pdf", "Keputusan Direksi No. 088/ADM-JKT/INT/X/24", "Pemeliharaan Kesehatan bagi Karyawan Bulanan Level 1 s.d 5", "1 Oktober 2024", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Memperhatikan kesejahteraan karyawan (sebagai mitra kerja) dalam hal kesehatan.", "Karyawan Bulanan Level 1-5 (Karyawan Tetap & Calon Karyawan Tetap); Keluarga (istri + anak ke-1 s.d. 3) khusus Karyawan Tetap pria.", "• Penggantian biaya kesehatan dalam negeri: rawat jalan, rawat inap, persalinan, gugur kandung, vaksinasi.\n• Keluarga ditanggung hanya untuk Karyawan Tetap pria: 1 istri sah dan anak ke-1 s.d. 3 (< 21 th, belum menikah, belum berpenghasilan, tanggungan); karyawan wanita & Calon Karyawan Tetap hanya diri sendiri.\n• Aturan urutan anak (lahir meninggal ≥ 7 bln kehamilan dihitung; anak kembar; penggantian anak yang meninggal).\n• Rawat inap: utamakan BPJS Kesehatan; selisih biaya yang masuk ketentuan ditanggung Perusahaan. Penyakit kronis/menahun via BPJS Kesehatan.\n• Persalinan s.d. anak ketiga; operasi caesar diganti bila ada pernyataan dokter (bahaya jiwa/komplikasi).\n• Pemeriksaan penunjang & tindakan medis atas rekomendasi dokter dan persetujuan Direktur Departemen; ijin spesialis/penunjang diajukan online.\n• Vaksinasi: Karyawan Tetap dan Anak usia maks. 5 tahun s.d. anak ketiga.\n• Klaim lewat sistem medical + kuitansi asli, diagnosa, nomor klaim; maks. 30 hari kalender sejak tanggal kuitansi.\n• Biaya yang tidak ditanggung tercantum di Lampiran III; karyawan tetap diikutkan BPJS Kesehatan.", "Plafon Calon Karyawan Tetap (100%, per tahun): L1 Rp25 jt; L2 Rp15 jt; L3 Rp10 jt; L4 Rp8 jt; L5 Rp6 jt.\nRawat jalan: Karyawan 100%; Keluarga L1-3 90%, L4-5 75%.\nKamar rawat inap > standar: Karyawan 85%; Keluarga L1-3 70%, L4-5 60%.\nStandar kamar per kota & level: lihat sheet 'Kesehatan - Plafon & Kamar'.\nMaks. hari persalinan: normal 5, SC 6, keguguran 1.\nBatas klaim: 30 hari kalender.", "UU No. 13/2003 jo. UU No. 6/2023; UU No. 24/2011 tentang BPJS; SK No. 149/HRD/SK-Dir/X/2021.", "SK No. 149/HRD/SK-Dir/X/2021 tentang Ketentuan Pemeliharaan Kesehatan bagi Karyawan Bulanan Level 1 s.d 5 dicabut dan tidak berlaku.", "14 hal. (6 hal. batang tubuh + Lampiran I 3 hal., II 2 hal., III 3 hal.).", "Cakupan keluarga hanya untuk Karyawan Tetap pria (Pasal 2 ayat 2 & 6). Kudus Level 4-5 rawat jalan wajib dokter peserta 'BPJS Kesehatan CUG Djarum'; apotek Kudus: Apotek Karya Sehat.", "Berlaku"], ["12", "Memo tentang Ketentuan Karyawan yang Ditempatkan di China - Nov 2024.pdf", "Memo No. 100/ADM-JKT/INT/XI/24", "Ketentuan Karyawan yang Ditempatkan di China", "1 November 2024", "Roberto S. Hartono (Chief Operating Officer)", "Tidak disebutkan (kop PT Hartono Istana Teknologi)", "Mengatur ketentuan karyawan yang ditempatkan di China dalam jangka waktu cukup panjang.", "Karyawan bagian Procurement yang ditempatkan di Negara China.", "• Berlandaskan SK Ketentuan Perjalanan Dinas yang berlaku.\n• Hari libur mengikuti ketentuan/kebijakan libur Negara China.\n• Hari & jam kerja: Senin-Jumat 09.00-18.00 waktu setempat; perubahan wajib diinformasikan dan disetujui atasan langsung.\n• Perjalanan dinas di dalam China: batas biaya makan dan akomodasi (lihat besaran).\n• Tunjangan lain mengacu SK Ketentuan Perjalanan Dinas No. 095/ADM-JKT/INT/X/24.", "Biaya makan: maks. RMB 120/hari.\nAkomodasi: maks. RMB 300/malam (normal); RMB 400/malam (high season).\nJam kerja: 09.00-18.00, Senin-Jumat.", "SK Ketentuan Perjalanan Dinas No. 095/ADM-JKT/INT/X/24 (dirujuk di isi memo).", "Memo No. 087/ADM-JKT/INT/X/24 tentang Ketentuan Karyawan yang Ditempatkan di China dicabut dan tidak berlaku.", "1 hal.; tanpa lampiran.", "Nama file mencantumkan 'Nov 2024'. SK Perjalanan Dinas 095/2024 yang dirujuk tidak ada di folder; SK Perjalanan Dinas terbaru kini No. 001/ADM-JKT/INT/IX/26.", "Berlaku"], ["13", "SK Beasiswa Karyawan.pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/I/25", "Program Beasiswa Karyawan", "1 Januari 2025", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Pengembangan karyawan melalui pendidikan formal untuk meningkatkan kompetensi dan kualitas SDM; apresiasi dan investasi untuk pengembangan karir.", "Karyawan Tetap Level Jabatan 3, 4, dan 5 (Lampiran I) yang memenuhi persyaratan.", "• Syarat: masa kerja min. 3 tahun & Karyawan Tetap; persetujuan HR (kedisiplinan + penilaian kinerja min. B selama 2 tahun terakhir); persetujuan atasan min. setara Level 2; usia maks. 40 tahun saat tanda tangan Ikatan Perjanjian.\n• Perguruan tinggi & jurusan disepakati bersama; Perusahaan menyediakan pilihan PT yang bekerja sama.\n• Beasiswa hanya biaya pendidikan resmi; tidak termasuk biaya hidup.\n• Wajib menandatangani Ikatan Perjanjian; bebas kriminal/narkoba/masalah media sosial.\n• Wajib tetap bekerja selama studi; izin studi mendesak diinformasikan ke atasan, direktur terkait, dan HR.\n• Gagal studi: wajib mengembalikan biaya beasiswa.\n• Resign sebelum masa ikatan selesai: penalti (Lampiran II); masa ikatan tidak boleh dipersingkat/diperpanjang.", "Masa ikatan: S1 Reguler 1n th; S1 RPL 2n th; S2 Reguler 2n th; S2 RPL 2n th (n = masa studi).\nPenalti: <1 th 100%; 1-<2 th 90%; 2-<3 th 80%; ≥3 th 70% dari total biaya.\nUsia maks.: 40 th. Masa kerja min.: 3 th.", "UU No. 13/2003 jo. UU No. 6/2023; SK No. 258/HRD/SK-Dir/IX/2017 tentang Ketentuan Penetapan Level Jabatan.", "Tidak ada SK yang dinyatakan dicabut.", "6 hal. (4 hal. batang tubuh + Lampiran I level & masa ikatan, II penalti).", "RPL = Rekognisi Pembelajaran Lampau. Lampiran II menyebut 'dihitung dengan rumus' tetapi isinya tabel persentase.", "Berlaku"], ["14", "SK Beasiswa Anak Karyawan.pdf", "Keputusan Direksi No. 002/ADM-JKT/INT/I/25", "Program Beasiswa Anak Karyawan", "1 Januari 2025", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Meningkatkan kesejahteraan karyawan sebagai apresiasi atas dedikasi, melalui dukungan pendidikan bagi anak karyawan.", "Anak sah karyawan yang tercatat di sistem kepegawaian; Beasiswa Bakti Pendidikan untuk level tertentu (Lampiran I), Beasiswa Plus untuk Level 1-7.", "• Syarat karyawan: masa kerja min. 3 tahun, Karyawan Tetap, tidak sedang SP; persetujuan HR (kinerja min. B 2 tahun terakhir); persetujuan atasan min. setara Level 2.\n• Pendaftaran awal tahun ajaran; diberikan setelah lolos seleksi; calon penerima bebas kriminal/narkoba/masalah media sosial.\n• Beasiswa Bakti Pendidikan (tanpa ikatan, berbasis kuota): tidak pernah tinggal kelas; rapor rata-rata min. 90,00 (2 semester terakhir); D3/S1: IP semester min. 3,25 (teknik) / 3,50 (non-teknik) dan IPK min. 3,00; dana kelulusan kelas 12 bila diterima PT dengan akreditasi jurusan min. B.\n• Batas masa studi: D3 6 semester; S1 tunggal 8 semester; S1 ganda 10 semester.\n• Beasiswa Plus (dengan Ikatan Perjanjian): D3 mulai semester 3 (IP smt 1-2 min. 3,30); S1 mulai semester 5 (IP smt 1-4 min. 3,30); persetujuan HR, lolos wawancara user, setuju ikatan & ketentuan pengupahan; prioritas jurusan Lampiran III; biaya SPP, pengembangan fasilitas, non-SPP dibayar langsung/reimbursement selama 2 tahun (4 semester).\n• Pencairan Bakti Pendidikan: SD-SMA bulanan selama 1 tahun; D3/S1 per semester selama 1 tahun.\n• Beasiswa berakhir bila lulus, karyawan PHK (pensiun: dilanjutkan s.d. masa berlaku; pelanggaran/resign: dihentikan), atau penerima melanggar, menikah, berhenti sekolah, tidak menyerahkan dokumen, laporan palsu, terikat institusi lain.", "Bakti Pendidikan: SD Rp150.000/bln; SMP Rp175.000/bln; SMA/SMK Rp300.000/bln; D3 & S1 Rp3.500.000/semester.\nDana kelulusan: SD Rp600.000; SMP Rp750.000; SMA/SMK Rp1.500.000.\nLevel berhak: SD & SMP L6-7; SMA/SMK L5-7; D3 & S1 L4-7.\nBeasiswa Plus – masa ikatan D3/S1: 2 tahun; penalti <1 th 100%, 1-<2 th 90%.", "UU No. 13/2003 jo. UU No. 6/2023; SK No. 258/HRD/SK-Dir/IX/2017 tentang Ketentuan Penetapan Level Jabatan.", "Tidak ada SK yang dinyatakan dicabut.", "9 hal. (6 hal. batang tubuh + Lampiran I besaran, II ikatan & penalti, III daftar jurusan).", "Jurusan prioritas Beasiswa Plus: Teknik Elektronika, Teknik Mesin, Teknik Informatika, Sistem Informasi, Desain Grafis, Desain Produk.", "Berlaku"], ["15", "Peraturan Direksi - Penugasan Sales Promotor & Karyawan Perwakilan (Signed).pdf", "Peraturan Direksi No. 066/COM-JKT/INT/III/25", "Penugasan Sales Promotor dan Karyawan Perwakilan", "1 Maret 2025", "Tekno Wibowo (Commercial Director)", "PT Hartono Istana Teknologi beserta afiliasinya", "Meningkatkan efektivitas dan efisiensi kegiatan pemasaran dan penjualan.", "Sales Promotor (tenaga kerja Pihak Ketiga) dan Karyawan Kantor Perwakilan yang ditugaskan ke luar lokasi kerja.", "• Penugasan ke luar lokasi kerja wajib dengan Surat Tugas yang ditandatangani Kepala Perwakilan (format Lampiran I).\n• Perusahaan dapat menetapkan Karyawan untuk Kegiatan Pendukung (dicantumkan di Surat Tugas); Sales Promotor hanya ditugaskan sesuai fungsi utama, tanpa Kegiatan Pendukung.\n• Penggantian biaya transportasi lewat sistem reimbursement + bukti asli + Surat Tugas yang disetujui, ke bagian Administrasi maks. 10 hari kerja setelah kembali.\n• Insentif penugasan diberikan kepada Sales Promotor dan Karyawan (Lampiran II).\n• Pembayaran insentif & transport melalui bagian Administrasi (fungsi keuangan) di tiap Kantor Perwakilan.", "Insentif penugasan: Rp50.000/orang/hari.\nTransport umum: sesuai kuitansi.\nTransport pribadi: (total jarak km ÷ 25) × harga BBM per liter (acuan Pertamax atau setara; jarak via Google Maps).\nBatas klaim: 10 hari kerja.", "Peraturan Direksi No. 001/COM-JKT/INT/IX/23 tentang Penugasan Sales Promotor dan Karyawan Perwakilan.", "Peraturan Direksi No. 001/COM-JKT/INT/XI/23 tentang Penugasan Sales Promotor dan Karyawan Perwakilan dicabut dan tidak berlaku.", "5 hal. (3 hal. batang tubuh + Lampiran I format Surat Tugas, II besaran).", "Nomor SK yang dicabut berbeda bulan dengan yang dirujuk di 'Mengingat' (IX/23 vs XI/23). Surat Tugas memuat: nama & jadwal kegiatan, lokasi, NIK, nama, store/showroom, jarak lokasi, tanggal, waktu, keterangan; ditandatangani Pemberi Tugas & Kepala Perwakilan.", "Berlaku"], ["16", "SK Pelaksanaan Pelatihan Karyawan.pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/IV/25", "Pelaksanaan Pelatihan Karyawan", "1 April 2025", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Meningkatkan pengetahuan dan kompetensi karyawan; mengelola biaya pelatihan secara bijak dan mempertimbangkan manfaat bagi Perusahaan.", "Seluruh Karyawan; unit kerja/bagian sebagai pengusul; Human Resources sebagai pengelola.", "• Pendekatan CBHRM: pelatihan dirancang berbasis kompetensi posisi saat ini dan posisi tujuan; prinsip kesetaraan, relevansi, efektivitas.\n• HR memfasilitasi Kepala Bagian menyusun kurikulum; kurikulum per posisi berdasarkan kamus & matriks kompetensi; ditinjau berkala.\n• Klasifikasi tujuan: Program Sertifikasi / Non Sertifikasi. Klasifikasi penyelenggara: Internal Unit, Inhouse (HR + fasilitator eksternal), Publik.\n• HR menyusun Rencana Pelatihan Tahunan dari analisis kesenjangan kompetensi; publikasi & usulan sesuai LoA.\n• HR memverifikasi usulan dan berwenang penuh menentukan penyelenggara dan fasilitator (pelatihan spesifik departemen sesuai LoA; pelatihan internal oleh SME ditunjuk bagian).\n• Perusahaan berwenang menentukan pelatihan yang mensyaratkan Ikatan Perjanjian; penalti bila hubungan kerja berakhir sebelum masa ikatan.\n• Seluruh biaya pelatihan yang disetujui ditanggung Perusahaan; peserta wajib hadir & aktif.\n• Evaluasi: penyelenggaraan, pre/post-test, project assignment, penerapan di tempat kerja; evaluasi khusus pelatihan strategis.\n• Jam pelatihan dan kontribusi SME dicatat di Learning Management System.", "Masa ikatan: ≤ Rp10 jt = 1 th; > Rp10 jt s.d. ≤ Rp20 jt = 2 th; > Rp20 jt = 3 th (mulai saat dinyatakan lulus).\nPenalti = (Sisa masa ikatan [bulan] ÷ Total masa ikatan [bulan]) × Seluruh biaya pelatihan.", "UU No. 13/2003 jo. UU No. 6/2023.", "Tidak ada SK yang dinyatakan dicabut.", "8 hal. (7 hal. batang tubuh + Lampiran I masa ikatan & rumus penalti).", "Pasal 7 ayat 3 merujuk 'lampiran II' untuk penalti, padahal SK hanya memiliki Lampiran I (rumus penalti ada di Lampiran I butir 2).", "Berlaku"], ["17", "SK Pemberian Premi.pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/V/25", "Pemberian Premi", "1 Mei 2025", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Memberikan penghargaan kepada karyawan yang menunjukkan keahlian khusus sesuai tujuan perusahaan.", "Karyawan Tetap (aktif min. 1 bulan) pada Job Title di Lampiran I – R&D Electric Vehicle: Mold Maker, Mold & Dies, CNC, Polishing, Assy & Fitting Technician.", "• Premi dirancang berdasarkan CBHRM (kompetensi yang diperlukan untuk posisi), memperhatikan relevansi dan efektivitas.\n• Diberikan tiap bulan bersama upah kepada karyawan yang memenuhi hasil penilaian kompetensi posisinya.\n• Kuota, kategori hasil penilaian, dan besaran di Lampiran II.\n• Evaluasi pemberian/perubahan premi tiap 3 bulan dengan persetujuan Pejabat Berwenang.\n• Tidak diberikan kepada karyawan yang terkena sanksi disiplin, mengundurkan diri, atau terlibat pelanggaran yang berpotensi merugikan.\n• Pengecualian diputuskan manajemen; Perusahaan berhak mencabut premi dengan persetujuan Pejabat Berwenang.", "Besaran premi/bulan: S Rp1.500.000; A Rp1.000.000; B Rp700.000; C Rp400.000.\nKuota kategori: S ditentukan manajemen; A 20%; B 30%; C 50% (per Job Title, dibulatkan ke atas).\nKuota maks. per Job Title: < 5 orang = sesuai jumlah karyawan; ≥ 5 orang = 20 orang.\nEvaluasi: tiap 3 bulan. Masa aktif min.: 1 bulan.", "UU No. 13/2003 jo. UU No. 6/2023.", "Tidak ada SK yang dinyatakan dicabut.", "5 hal. (3 hal. batang tubuh + Lampiran I daftar Job Title, II kuota & besaran).", "Kuota '≥ 5 orang = 20 orang' perlu dikonfirmasi (apakah maksudnya 20 orang atau 20%). Job Title Code: 737, 740, 742, 745, 747.", "Berlaku"], ["18", "Keputusan Direksi - Seragam Kerja Karyawan (Signed).pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/XII/25", "Seragam Kerja Karyawan", "1 Desember 2025", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi dan PT Sarana Kencana Mulya", "Memperkuat identitas perusahaan dan memastikan keseragaman pakaian di tempat kerja.", "Karyawan yang jenis pekerjaannya tercatat di Human Resources sebagai penerima seragam; ketentuan pakaian kerja bagi yang tidak menerima seragam.", "• Seragam diberikan sesuai jenis pekerjaan (jenis, waktu pemberian, penggantian: Lampiran I; desain: Lampiran II).\n• Wajib dipakai saat bertugas; wajib dijaga, dipelihara, tidak diperjualbelikan.\n• Tidak boleh minta ganti sebelum periode selesai, kecuali rusak dan terkonfirmasi General Services.\n• Karyawan tanpa seragam: bebas berpakaian kerja yang rapi, sopan, tidak mengandung SARA; karyawati boleh berkerudung dan manset tangan (handsock decker).\n• Pengajuan reguler tiap September, distribusi mulai Januari tahun berikutnya (prosedur Lampiran III); di luar periode via formulir online ke General Services.\n• Pengadaan, pengelolaan, distribusi oleh General Services melalui bagian masing-masing.\n• Wajib dikembalikan bila pindah ke bagian tanpa seragam, mendapat seragam pengganti, atau resign/PHK; tidak lengkap = ganti rugi sesuai harga dari HR.\n• Seragam yang dikembalikan wajib dimusnahkan dengan Berita Acara + dokumentasi (mengetahui Head of General Services Plant).", "Semua jenis: 3 pcs sejak pertama bergabung.\nPenggantian 2 tahun sekali: Wearpack, PDL/PDL Pemadam, Safari, Driver.\nPenggantian 1 tahun sekali: Kaos Kerah Commercial.\nAksesoris PDL/PDL Pemadam: kaos dalam, kaos kaki, sepatu, ikat pinggang dalam, kopel, topi/baret, peluit, tali kur.\nAksesoris Safari: kaos dalam, kaos kaki, sepatu, ikat pinggang dalam, kopel, topi, peluit, tali kur.", "Perjanjian Kerja Bersama (PKB).", "SK No. 203/ADM-JKT/INT/IX/23 tentang Seragam Kerja Karyawan dicabut dan tidak berlaku.", "9 hal. (3 hal. batang tubuh + Lampiran I tabel, II desain 3 hal., III prosedur & Berita Acara 2 hal.).", "Judul 'Keputusan Direksi' tetapi Menimbang dan kop Lampiran menyebut 'Peraturan Direksi'. Berita Acara (Lamp. III) masih memuat Seragam Kaos Kerja, Kemeja Biru, Cleaning Service, Pantry yang tidak ada di Lampiran I.", "Berlaku"], ["19", "Ketentuan Fasilitas Kendaraan Inventaris (Signed).pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/I/26", "Ketentuan Pemberian Fasilitas Kendaraan Inventaris", "1 Januari 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Meningkatkan kesejahteraan dan kenyamanan karyawan melalui fasilitas yang mendukung mobilitas; mengatur ketentuan pemberian kendaraan.", "Karyawan Level Jabatan 1-2 (Lampiran I).", "• Kendaraan Inventaris diberikan secara melekat sesuai Level Jabatan; jenis & masa pakai ditentukan Perusahaan (dapat diperpanjang).\n• Karyawan wajib menjaga dan bertanggung jawab atas kendaraan.\n• EV: 1 unit wall charger, biaya pemasangan pertama ditanggung Perusahaan; fasilitas penunjang di Lampiran II; biaya pengadaan listrik (tambah meter/daya) tidak ditanggung.\n• Non-EV: fasilitas penunjang (BBM) di Lampiran III.\n• Perusahaan menanggung perawatan berkala, perbaikan non-kelalaian di bengkel yang ditunjuk, perpanjangan STNK & administrasi.\n• Fasilitas berakhir bila hubungan kerja berakhir, dicabut, kendaraan diganti, atau diputuskan lain oleh COO; kendaraan dikembalikan via General Services sesuai kondisi awal; tanpa ganti rugi.", "Level 1-2: Polytron G3+, masa pakai 5 tahun.\nEV Level 1: charging di kantor & reimburse SPKLU; Level 2: Tunjangan Transport Rp1.500.000.\nBBM non-EV: Level 1 sesuai tagihan; Level 2 JABODETABEK maks. 250 liter/bulan; Level 2 non-JABODETABEK maks. 150 liter/bulan.", "SK No. 258/HRD/SK-Dir/IX/2017 tentang Penetapan Level Jabatan; SK No. 301/HRD/SK-Dir/XII/2018 tentang Ketentuan Pemberian Fasilitas Kendaraan Inventaris; PP/PKB.", "SK No. 301/HRD/SK-Dir/XII/2018 tentang Ketentuan Pemberian Fasilitas Kendaraan Inventaris dicabut dan tidak berlaku.", "7 hal. (4 hal. batang tubuh + Lampiran I, II, III).", "Lampiran II tertulis 'Pengisian Data di SPKLU' (seharusnya 'Pengisian Daya'). Periode Tunjangan Transport Level 2 tidak disebut (per bulan?). Jenis & warna kendaraan dapat berubah; dapat diberikan non-EV. | Update 20 Okt 2026: PDF kembali tersedia di folder; isi (Lampiran I-III, Tunjangan Transport Rp1.500.000, batas BBM 250/150 liter) diverifikasi sesuai rangkuman.", "Berlaku"], ["20", "Ketentuan Fasilitas Kendaraan Operasional.pdf", "Keputusan Direksi No. 002/ADM-JKT/INT/I/26", "Ketentuan Pemberian Fasilitas Kendaraan Operasional", "1 Januari 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Mendukung efektivitas karyawan dalam tugas; menyediakan kendaraan operasional bagi karyawan bertugas lapangan / bermobilitas tinggi.", "Karyawan dengan fungsi pekerjaan yang ditetapkan Direksi (tugas lapangan / mobilitas tinggi).", "• Kendaraan Operasional diberikan sesuai fungsi pekerjaan; jenis & masa pakai di Lampiran I (dapat diperpanjang).\n• EV: boleh charging di kantor atau reimburse SPKLU dengan bukti sah, persetujuan & kendali atasan berwenang.\n• Non-EV: penggantian BBM dengan bukti sah.\n• Dilarang dipakai untuk kepentingan pribadi/pihak lain.\n• Perusahaan menanggung perawatan berkala, perbaikan non-kelalaian di bengkel yang ditunjuk, perpanjangan STNK & administrasi.\n• Berakhir bila hubungan kerja berakhir, dicabut, diganti, atau diputuskan lain oleh COO; dikembalikan via General Services; tanpa ganti rugi.", "Jenis kendaraan: Polytron G3, masa pakai 5 tahun.\nBBM non-EV: sesuai bukti sah (tanpa batas liter disebutkan).", "Peraturan Perusahaan / PKB yang berlaku.", "Tidak ada SK yang dinyatakan dicabut.", "5 hal. (4 hal. batang tubuh + Lampiran I).", "Daftar fungsi pekerjaan penerima tidak dilampirkan (ditetapkan Direksi). Batas biaya BBM/charging tidak diatur.", "Berlaku"], ["21", "Ketentuan Tunjangan Kerja Shift Karyawan.pdf", "Keputusan Direksi No. 005/ADM-JKT/INT/I/26", "Tunjangan Kerja Shift Karyawan", "1 Februari 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya", "Menjaga keberlangsungan operasional (sistem kerja shift) dan mengimbanginya dengan tunjangan untuk kesejahteraan karyawan.", "Karyawan Harian dan Karyawan Bulanan yang bekerja dengan sistem shift.", "• Tunjangan Kerja Shift = komponen upah berupa tunjangan tidak tetap bagi karyawan shift (Harian maupun Bulanan).\n• Dihitung per hari berdasarkan kelompok shift.\n• Dibayarkan bersamaan dengan penggajian bulan berjalan.", "Shift II (14.00-22.00 / 15.00-23.00 / 15.30-00.30): Rp3.000/hari.\nShift III (19.00-04.00 / 20.00-05.00 / 22.00-06.00): Rp4.000/hari.\nShift Panjang (17.00-07.00 / 18.00-06.00 / 19.00-07.00 / 20.00-06.00): Rp4.500/hari.", "UU No. 13/2003 jo. UU No. 11/2020; PP No. 36/2021 tentang Pengupahan; PKB; SK No. 43/ADM-KDS/I/2022 tentang Tunjangan Kerja Shift Karyawan Polytron Group.", "Keputusan Direksi No. 43/ADM-KDS/I/2022 tentang Tunjangan Kerja Shift Karyawan Polytron Group dicabut dan tidak berlaku.", "3 hal.; tanpa lampiran.", "Nomor SK berkode bulan I (Januari) 2026 tetapi ditetapkan 1 Februari 2026. 'Mengingat' masih PP 36/2021 (sudah diubah PP 51/2023 yang dipakai SK Pinjaman Dana).", "Berlaku"], ["22", "Memo tentang Pemberian Penghargaan kepada Karyawan Pensiun.pdf", "Memo No. 002/ADM-JKT/INT/X/26", "Pemberian Penghargaan kepada Karyawan Pensiun", "1 Oktober 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi (kop Jakarta; memo tidak memuat definisi 'Perusahaan'/afiliasi)", "Memberikan apresiasi kepada Karyawan atas dedikasi dan kontribusinya.", "Karyawan pensiun; masa kerja dihitung sejak tanggal bergabung di Perusahaan.", "• Perusahaan memberi penghargaan kepada Karyawan pensiun; masa kerja dihitung sejak tanggal bergabung.\n• Kategori penghargaan menurut masa kerja (Lampiran I): > 30 tahun = Plakat A; 15-30 tahun = Plakat B; < 15 tahun = Piagam.\n• Desain penghargaan ditetapkan Perusahaan.\n• Berlaku sejak ditetapkan; dapat berubah sewaktu-waktu bila ada kekeliruan, kekurangan, atau ketidaksesuaian.", "Tidak ada nominal Rupiah.\nKategori: > 30 th Plakat A; 15-30 th Plakat B; < 15 th Piagam.", "Tidak dicantumkan (format memo).", "Tidak ada yang dinyatakan dicabut.", "2 hal. (1 hal. memo + Lampiran I kategori penghargaan).", "Memo ini tidak menyebut hubungannya dengan Memo Uang Penghargaan Masa Bakti No. 049/ADM-JKT/INT/V/2024 (uang untuk Karyawan Bulanan masa kerja min. 20 tahun); keduanya tampak melengkapi, bukan menggantikan. Batas kategori di angka 15 dan 30 tahun: Lampiran menulis '15 – 30 tahun' sehingga masa kerja tepat 30 tahun masuk Plakat B.", "Berlaku"], ["23", "SK tentang TUNJANGAN MASA KERJA.pdf", "Keputusan Direksi No. 42/ADM-KDS/I/2022", "Tunjangan Masa Kerja Karyawan Harian Polytron Group", "19 Januari 2022 (berlaku 1 Februari 2022)", "Roberto S. Hartono (Direktur)", "Polytron Group (ditetapkan di Kudus)", "Memperbarui SK 188/HRD/SK-Dir/VIII/2018 dan memisahkan ketentuan tunjangan masa kerja Karyawan Harian dari ketentuan tunjangan kerja shift agar administrasi lebih mudah.", "Karyawan Harian (Tetap maupun Kontrak) dengan masa kerja min. 1 tahun; masa kerja dihitung sejak tanggal diterima sebagai Karyawan Harian.", "• Tunjangan masa kerja = komponen upah berupa tunjangan TETAP.\n• Besaran per hari atau per bulan (30 hari); naik Rp150/hari (Rp4.500/bulan) untuk setiap tambahan 1 tahun masa kerja.\n• Dibayarkan bersamaan dengan penggajian bulan berjalan.\n• Mencabut SK 188/HRD/SK-Dir/VIII/2018 tentang Tunjangan Masa Kerja Karyawan Harian dan Tunjangan Kerja Shift.\n• Berlaku mulai 1 Februari 2022.", "Masa kerja 1 - <2 th: Rp150/hari = Rp4.500/bln.\nMasa kerja 10 - <11 th: Rp1.500/hari = Rp45.000/bln.\nMasa kerja 20 - <21 th: Rp3.000/hari = Rp90.000/bln.\nMasa kerja 30 th ke atas: Rp4.500/hari = Rp135.000/bln (30 tingkat, lihat sheet Lampiran & Besaran).", "UU No. 13/2003 jo. UU No. 11/2020 Cipta Kerja; PP No. 36/2021 tentang Pengupahan; Perjanjian Kerja Bersama (PKB); SK No. 188/HRD/SK-Dir/VIII/2018.", "SK No. 188/HRD/SK-Dir/VIII/2018 tentang Tunjangan Masa Kerja Karyawan Harian dan Tunjangan Kerja Shift Karyawan Polytron Group dinyatakan tidak berlaku (Pasal 3).", "2 hal. (batang tubuh dengan tabel besaran pada Pasal 2; tanpa lampiran).", "Menimbang a menyebut SK 188/HRD/Sk-Dir/VII/2018 sedangkan Mengingat dan Pasal 3 menyebut VIII/2018. Cakupan 'Karyawan Harian baik Tetap maupun Kontrak' berbeda dari definisi Karyawan Harian di SK Shift 2026 (Calon Karyawan Tetap dan Karyawan Tetap). SK ini tidak disebut dicabut oleh SK lain di folder, sehingga dianggap masih berlaku.", "Berlaku"], ["24", "SK - Perjalanan Dinas (Signed).pdf", "Keputusan Direksi No. 001/ADM-JKT/INT/IX/26", "Ketentuan Perjalanan Dinas", "1 September 2026", "Roberto S. Hartono (Chief Operating Officer)", "PT Hartono Istana Teknologi beserta afiliasinya (kop Jakarta)", "Mengatur ketentuan perjalanan dinas dalam dan luar negeri (tunjangan, transportasi, akomodasi, biaya makan, komunikasi, binatu, entertainment) agar seragam dan terkendali.", "Seluruh Karyawan Perusahaan yang melakukan Perjalanan Dinas; fasilitas dibedakan menurut Level Jabatan 1-7 dan jarak (dalam negeri ≤150 KM vs >150 KM sekali tempuh) atau luar negeri.", "• Dalam negeri ≤150 KM: hanya transportasi, BBM, parkir, tol yang diganti wajar dengan kuitansi (kendaraan operasional/pribadi/sewaan/umum).\n• Dalam negeri >150 KM: Tunjangan Perjalanan Dinas, Akomodasi, Biaya Makan sesuai Lampiran I; pilih transportasi udara/darat/laut.\n• Luar negeri: transportasi udara; Tunjangan & Biaya Makan sesuai Lampiran III; pocket modem/router Wi-Fi atau penggantian Biaya Komunikasi.\n• Tiket via Administrator Perjalanan (atau mandiri lalu reimburse); akomodasi wajib hotel rekanan; Biaya Entertainment atas persetujuan; Biaya Binatu hanya untuk perjalanan >4 hari (setelah hari kedua, maks 4 potong/2 kg per hari).\n• BBM/EV kendaraan pribadi: (KM akhir − KM awal)/7 × harga BBM per liter (Pertamax/setara); EV: (KM akhir − KM awal)/5 × harga listrik per KWH (acuan SPKLU PLN) - Lampiran II.\n• Cash Advance via Formulir ke Finance; LPJ maks 10 hari kerja setelah kembali; reimbursement maks 10 hari kerja; pengecualian/pelanggaran perlu persetujuan Direktur Departemen.", "Dalam negeri >150 KM (Lampiran I), per hari / per malam:\n• Tunjangan Perjalanan Dinas: L1-L2 tidak ada; L3-L7 Rp20.000/hari.\n• Biaya Makan maks/hari: L1-L2 sesuai tagihan (wajar); L3 Rp180.000; L4 Rp150.000; L5-L7 Rp120.000.\n• Akomodasi maks/malam (Normal / High Season): L1 Rp1.250.000/Rp1.600.000; L2-L3 Rp900.000/Rp1.250.000; L4-L5 Rp700.000/Rp900.000; L6-L7 Rp400.000/Rp500.000.\n• Udara: L1 dapat upgrade Bisnis; L2-L7 Ekonomi.\nLuar negeri (Lampiran III):\n• Tunjangan: L1 tidak ada; L2-L7 USD 5/hari.\n• Biaya Makan maks/hari: L1 sesuai tagihan; L2-L3 USD 45; L4-L7 USD 30.\n• Akomodasi maks/malam: L1 USD 300; L2-L3 USD 200; L4-L7 USD 150.\n• Udara: L1 Bisnis; L2 dapat upgrade Bisnis jika >6 jam (direct flight); L3-L7 Ekonomi.", "SK No. 258/HRD/SK-Dir/IX/2017 tentang Level Jabatan; SK No. 001/ADM-JKT/INT/VII/26 tentang Perjalanan Dinas.", "Mencabut SK (Keputusan Direksi) No. 001/ADM-JKT/INT/VII/26 tentang Perjalanan Dinas (Pasal 7).", "10 hal. (6 hal. batang tubuh, 7 pasal + Lampiran I Dalam Negeri 1 hal., Lampiran II Rumus BBM/EV 2 hal., Lampiran III Luar Negeri 1 hal.). Tabel lampiran berbentuk gambar (diverifikasi visual).", "SK Perjalanan Dinas terbaru; menggantikan versi Juli 2026 (file versi VII/26 tidak ada di folder). Rujukan Komp. LK 2024 (SK 067/2022) dan Memo China (SK 095/2024) kemungkinan sudah tidak mutakhir.", "Berlaku"]], "Indeks Kode SK": /ADM-JKT/INT/I/26", "Tunjangan Kerja Shift Karyawan", "1 Februari 2026", "Roberto S. Hartono (Chief Operating Officer)", "Berlaku"], ["Penghargaan Pensiun", "Memo No. 002/ADM-JKT/INT/X/26", "Pemberian Penghargaan kepada Karyawan Pensiun", "1 Oktober 2026", "Roberto S. Hartono (Chief Operating Officer)", "Berlaku"], ["Tunjangan Masa Kerja", "Keputusan Direksi No. 42/ADM-KDS/I/2022", "Tunjangan Masa Kerja Karyawan Harian Polytron Group", "19 Januari 2022 (berlaku 1 Februari 2022)", "Roberto S. Hartono (Direktur)", "Berlaku"], ["Perjalanan Dinas", "Keputusan Direksi No. 001/ADM-JKT/INT/IX/26", "Ketentuan Perjalanan Dinas", "1 September 2026", "Roberto S. Hartono (Chief Operating Officer)", "Berlaku"], ["Kode dipakai sebagai acuan kolom 'SK' di sheet lain dan kolom 'Sumber SK' di Kamus_Istilah_SK.xlsx. Urutan baris sama dengan sheet 'Ringkasan SK'.", "", "", "", "", ""]], "Ketentuan per Pasal": [["SK", "Pasal / Bagian", "Judul Pasal", "Isi Ringkas"], ["MCU", "Pasal 1", "Ketentuan Umum", "Mendefinisikan Perusahaan, Karyawan Bulanan, Calon Karyawan Tetap, Karyawan Tetap, Level Jabatan, General Medical Check Up, Reimbursement."], ["MCU", "Pasal 2", "Pelaksanaan GMCU", "Hanya bagi Karyawan; efektif masa kerja min. 1 tahun; periode (Lamp. I) dan paket (Lamp. II) ditentukan Perusahaan; keterlambatan maks. 2 bulan; tindak lanjut medis sesuai prosedur Perusahaan; boleh di RS/lab pilihan Perusahaan atau pilihan karyawan."], ["MCU", "Pasal 3", "Lokasi yang Ditentukan Perusahaan", "Karyawan membawa surat pengantar dan jadwal dari Perusahaan; biaya ditagihkan langsung ke Perusahaan; hasil dikirim ke HR untuk didokumentasikan, asli diberikan ke karyawan."], ["MCU", "Pasal 4", "Lokasi yang Dipilih Karyawan", "Mandiri dengan reimbursement + bukti bayar sah; selisih di atas batas biaya ditanggung karyawan; tambahan jenis pemeriksaan atas biaya karyawan (bukti terpisah); hasil dilaporkan ke HR."], ["MCU", "Pasal 5-6", "Penutup", "Peraturan lain yang mengatur hal sama tidak berlaku; berlaku sejak tanggal ditetapkan (1 Januari 2023)."], ["Duka/Suka Cita", "Pasal 1", "Ketentuan Umum", "Mendefinisikan Sumbangan Duka Cita (karena meninggal dunia) dan Ucapan Suka Cita (karena pernikahan)."], ["Duka/Suka Cita", "Pasal 2", "Sumbangan Duka Cita", "Level 6-7 & Karyawan Harian: Rp1.000.000 (karyawan sendiri) / Rp500.000 (keluarga inti). Karyawan Bulanan Level 1-5: karangan bunga."], ["Duka/Suka Cita", "Pasal 3", "Ucapan Suka Cita", "Karangan bunga: Karyawan Harian untuk dirinya sendiri; Karyawan Bulanan untuk dirinya dan anaknya."], ["Duka/Suka Cita", "Pasal 4-5", "Penutup", "Peraturan lain tidak berlaku; berlaku sejak ditetapkan (1 Januari 2023)."], ["Skema Teknisi", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Kantor Perwakilan, Karyawan Tidak Tetap/Tetap, Teknisi, Kepala Servis, kewajiban SKKNI & pelatihan, UMK, Insentif Reparasi, Tunjangan Jabatan, Tunjangan Lokasi, Tunjangan Kemahalan."], ["Skema Teknisi", "Pasal 2", "Penerimaan Karyawan Baru Service Center", "Kantor Perwakilan merekrut sendiri; Teknisi baru berstatus Karyawan Tidak Tetap 6 bulan; evaluasi atasan langsung."], ["Skema Teknisi", "Pasal 3", "Mutasi Karyawan Service Center", "Mutasi permanen: Tunjangan Lokasi, Tunjangan Kemahalan, tiket PP 1x/tahun (tidak akumulasi, untuk penempatan luar Jawa); besaran di Lampiran; kebijakan khusus bila akomodasi lebih mahal."], ["Skema Teknisi", "Pasal 4", "(Tidak ada dalam dokumen)", "Penomoran loncat dari Pasal 3 ke Pasal 5."], ["Skema Teknisi", "Pasal 5", "Pengecualian", "Tidak ada penggantian untuk: biaya akibat kelalaian; biaya pribadi; mutasi atas permintaan sendiri ke UMK lebih rendah (gaji pokok disesuaikan); Tunjangan Kemahalan tidak berlaku bila disediakan tempat tinggal."], ["Skema Teknisi", "Pasal 6-7", "Penutup", "Peraturan lain tidak berlaku; berlaku sejak ditetapkan (1 Desember 2022)."], ["NOP", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Level Jabatan, Notebook, NOP, Ikatan Perjanjian, Masa Tunggu."], ["NOP", "Pasal 2", "Kebijakan Umum", "Syarat peserta (masa kerja 3 bulan; persetujuan HR, ESD, atasan min. Level 3); bersifat penawaran; notebook milik pribadi; ketentuan plafon dan selisih harga; wajib menyetujui Perjanjian NOP."], ["NOP", "Pasal 3", "Kebijakan Khusus", "Tanggung jawab atas data Perusahaan, lisensi resmi, jaringan aman, kepatuhan hukum; HKI milik Perusahaan; pembebasan Perusahaan dari gugatan."], ["NOP", "Pasal 4", "Ketentuan Pasca Penerimaan Program", "Ikatan 3 tahun; penalti bila resign (Lamp. III); masa tunggu tahun ke-4 tanpa penalti; boleh ikut lagi setelah masa tunggu; masa kepesertaan tidak boleh diubah; notebook tak bisa dipakai -> ikatan diakhiri; pelunasan kewajiban."], ["NOP", "Pasal 5", "Penutup", "Berlaku sejak ditetapkan; lampiran satu kesatuan; dapat berubah sewaktu-waktu; mencabut SK 170/ADM-JKT/INT/V/2023."], ["UTH Driver", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Driver Truk, Helper Truk, Kegiatan Operasional, Penugasan Operasional, UTH, Insentif Operasional, Uang Operasional Kendaraan, BOP Balen."], ["UTH Driver", "Pasal 2", "Ketentuan UTH", "Per hari, tidak tetap; tidak berhak bila tidak bekerja sesuai tugas; hari libur 1,5x; Idul Fitri (2 hari)/Natal/Tahun Baru 2x; tujuan terjauh jadi dasar hitung bila ada tujuan tambahan."], ["UTH Driver", "Pasal 3", "Ketentuan Insentif Operasional", "Per hari, tidak tetap, untuk Driver/Helper Truk Gandeng/Non-Gandeng yang melaksanakan Penugasan Operasional."], ["UTH Driver", "Pasal 4", "Uang Operasional Kendaraan", "Mencakup pungutan lapangan, parkir, retribusi, perawatan ringan (tambal ban, tambah angin), biaya lain; menjadi tanggung jawab Driver/Helper baik ada pemakaian maupun tidak."], ["UTH Driver", "Pasal 5", "BOP Balen", "Untuk muatan balen; dihitung dari jumlah muatan/kapasitas kendaraan; dapat mempertimbangkan lokasi pengambilan/tujuan."], ["UTH Driver", "Pasal 6", "Besaran", "UTH ditetapkan Logistik (Lampiran I); Insentif/Uang Operasional/BOP Balen ditetapkan Logistik dengan pertimbangan tertentu dan disetujui Head of Supply Chain Management; pembulatan ke atas kelipatan Rp5.000; dapat ditinjau sewaktu-waktu."], ["UTH Driver", "Pasal 7", "Penutup", "Berlaku sejak 1 Juli 2026; dapat berubah; mencabut SK 210/HRD & GS/MAP/IX/2018."], ["Pinjaman", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Upah Pokok, Ketentuan Koperasi, Fasilitas Pinjaman, Total Angsuran, Surat Peringatan (SP)."], ["Pinjaman", "Pasal 2", "Kebijakan Umum", "Pinjaman melalui Koperasi yang ditunjuk; bukan hak otomatis karyawan."], ["Pinjaman", "Pasal 3", "Persyaratan", "Anggota koperasi; tidak ada SP berlaku; Total Angsuran maks. 30% Upah Pokok; sesuai LoA; pengecualian untuk kondisi mendesak; Perusahaan berhak menolak/mengurangi/menyesuaikan."], ["Pinjaman", "Pasal 4", "Pengajuan", "Diajukan mandiri dengan formulir; informasi benar; verifikasi & evaluasi Perusahaan; dokumen tambahan; persetujuan dituangkan dalam dokumen/perjanjian."], ["Pinjaman", "Pasal 5", "Mekanisme", "Pencairan Koperasi ke rekening pengupahan; angsuran dipotong dari Upah Pokok tiap bulan sampai lunas."], ["Pinjaman", "Pasal 6", "Penyelesaian Kewajiban", "Saat PHK/resign sisa pinjaman diselesaikan; dapat dipotong dari upah terakhir/hak lain; kekurangan dilunasi karyawan; Perusahaan menetapkan mekanisme penyelesaian."], ["Pinjaman", "Pasal 7", "Penutup", "Berlaku sejak 1 Oktober 2026; lampiran satu kesatuan; dapat berubah sewaktu-waktu."], ["Komp. LK 2021", "Butir 1-2", "Pembukaan", "Perusahaan = PT Sarana Kencana Mulya; meninjau surat No. 005/COM/SK-DIR/X/19."], ["Komp. LK 2021", "Butir 3", "Jenis Kompensasi", "Tunjangan Luar Kota (perjalanan luar kota untuk tugas rutin) dan Tunjangan Penempatan (penempatan di PSR di luar daerah asal, min. 1 bulan; tidak untuk rekrutmen lokal)."], ["Komp. LK 2021", "Butir 4-5; Lampiran 1", "Penerima & Besaran", "Sales Executive & Helper: Tunj. Luar Kota; Technician & Driver: Tunj. Luar Kota + Penempatan. Rp15.000/hari (tolak), Rp60.000/hari (menginap), Rp500.000/bulan (penempatan)."], ["Komp. LK 2021", "Butir 6-8", "Penutup", "Berlaku sejak ditetapkan (5 Maret 2021); peraturan lain tidak berlaku; dapat diperbaiki bila ada kekeliruan."], ["Komp. LK 2024", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan (PT HIT dan PT SKM), Karyawan, Tunjangan, Tunjangan Luar Kota, Tunjangan Penempatan."], ["Komp. LK 2024", "Pasal 2", "Ketentuan Pemberian Kompensasi", "Tunjangan bagi Karyawan PSR yang ke luar kota (jenis per pekerjaan & besaran di Lampiran I); penginapan mengikuti SK Perjalanan Dinas 067/2022; Tunjangan Penempatan untuk penugasan di luar daerah asal min. 1 bulan."], ["Komp. LK 2024", "Pasal 3", "Ketentuan Penutup", "Berlaku sejak ditetapkan (1 Maret 2024); mencabut SK 214/ADM-JKT/INT/VII/2023."], ["Masa Bakti", "Butir 1-2", "Perusahaan & Pendataan", "Perusahaan = PT HIT beserta afiliasinya; HR Operations mengirim data karyawan yang akan pensiun dalam 2 bulan ke depan secara periodik ke Direksi."], ["Masa Bakti", "Butir 3", "Kriteria", "Karyawan Bulanan; masa kerja min. 20 tahun; perilaku & kontribusi baik; direkomendasikan Direksi dengan formulir Lampiran I."], ["Masa Bakti", "Butir 4", "Besaran", "Ditentukan atas kesepakatan manajemen dengan mempertimbangkan kontribusi; bukan hak karyawan."], ["Masa Bakti", "Butir 5-6", "Penutup", "Berlaku sejak ditetapkan (1 Mei 2024); dapat berubah sewaktu-waktu."], ["Pengumuman Seragam", "Butir 1-2", "Penghentian Seragam Produksi", "Seragam Kemeja Biru & Seragam Kaos Kerja (Lamp. II No. 1-2 SK 203/23) tidak lagi disediakan; seragam lain tetap disediakan."], ["Pengumuman Seragam", "Butir 3-4", "Masa Transisi & Pakaian Kerja", "Stok tersisa diberikan hingga habis dan wajib dipakai; karyawan tanpa seragam berpakaian sopan, rapi, sesuai etika; berlaku tanpa batas waktu."], ["Kesehatan", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Karyawan Bulanan, Calon Karyawan Tetap, Karyawan Tetap, Keluarga, Istri, Anak, Level, Dokter Perusahaan, Apotek Rekanan, Pemeriksaan Penunjang, Tindakan Medis."], ["Kesehatan", "Pasal 2", "Kebijakan Umum", "Penggantian biaya bagi Karyawan L1-5; keluarga (1 istri + anak ke-1 s.d. 3, < 21 th) hanya untuk Karyawan Tetap pria; aturan urutan anak, anak kembar, penggantian anak yang meninggal; hanya dalam negeri (rawat jalan, rawat inap, persalinan, gugur kandung, vaksinasi); karyawan wanita & Calon Karyawan Tetap hanya diri sendiri."], ["Kesehatan", "Pasal 3", "Rawat Jalan", "Mengganti dokter, administrasi, obat, penunjang, tindakan, kamar sementara/operasi; besaran Lampiran I; ketentuan & pengambilan obat Lampiran II."], ["Kesehatan", "Pasal 4", "Rawat Inap", "Utamakan BPJS Kesehatan; selisih yang masuk ketentuan ditanggung Perusahaan; mengganti kamar dan biaya non-kamar (dokter, obat, penunjang, tindakan, kamar operasi, ICU/ICCU); besaran Lampiran I."], ["Kesehatan", "Pasal 5", "Penanganan Penyakit Kronis", "Penyakit kronis/menahun (cuci darah, ring jantung, dll.) dijamin BPJS Kesehatan; HRD memprioritaskan jalur BPJS."], ["Kesehatan", "Pasal 6", "Persalinan dan Gugur Kandung", "Diganti s.d. kelahiran anak ketiga (dokter/bidan, kamar ibu & bayi, tindakan, obat); operasi caesar dengan pernyataan tertulis dokter (bahaya jiwa / komplikasi)."], ["Kesehatan", "Pasal 7", "Pemeriksaan Penunjang dan Tindakan Medis", "Atas rekomendasi dokter dan persetujuan Direktur Departemen."], ["Kesehatan", "Pasal 8", "Vaksinasi", "Karyawan Tetap dan Anak usia maks. 5 tahun s.d. anak ketiga (dokter, vaksin, administrasi); jenis di Lampiran I."], ["Kesehatan", "Pasal 9", "Biaya yang Tidak Ditanggung", "Biaya di luar ketentuan menjadi beban karyawan; daftar di Lampiran III; kasus lain diputuskan Perusahaan."], ["Kesehatan", "Pasal 10", "Tata Cara Penggantian", "Input tagihan di sistem medical + kuitansi asli, diagnosa, nomor klaim, rincian biaya; maks. 30 hari kalender setelah tanggal kuitansi."], ["Kesehatan", "Pasal 11", "Penutup", "Karyawan tetap diikutkan BPJS Kesehatan; berlaku sejak 1 Oktober 2024; mencabut SK 149/HRD/SK-Dir/X/2021."], ["China", "Butir 1-3", "Cakupan & Hari Libur", "Karyawan bagian Procurement yang ditempatkan di China; berlandaskan SK Perjalanan Dinas; hari libur mengikuti China."], ["China", "Butir 4", "Hari dan Waktu Kerja", "Senin-Jumat 09.00-18.00 waktu setempat; perubahan wajib disetujui atasan langsung."], ["China", "Butir 5-6", "Tunjangan Perjalanan Dinas", "Makan maks. RMB 120/hari; akomodasi maks. RMB 300/malam (normal) / RMB 400 (high season); lainnya mengacu SK 095/ADM-JKT/INT/X/24."], ["China", "Butir 7-8", "Penutup", "Berlaku sejak 1 November 2024; mencabut Memo 087/ADM-JKT/INT/X/24."], ["Beasiswa Karyawan", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Karyawan Tetap, Level Jabatan, Ikatan Perjanjian."], ["Beasiswa Karyawan", "Pasal 2", "Kebijakan Umum", "Syarat (masa kerja 3 th, Karyawan Tetap, kinerja min. B 2 th, persetujuan atasan min. L2, usia maks. 40 th); PT & jurusan disepakati; hanya biaya pendidikan; wajib Ikatan Perjanjian; bebas kriminal/narkoba/masalah medsos."], ["Beasiswa Karyawan", "Pasal 3", "Kebijakan Khusus", "Selesaikan studi tepat waktu; tetap bekerja; izin studi mendesak via atasan, direktur, HR; gagal studi wajib mengembalikan biaya."], ["Beasiswa Karyawan", "Pasal 4", "Ketentuan Pasca Kelulusan", "Ikatan Perjanjian sesuai Lampiran I; penalti resign Lampiran II; masa ikatan tidak boleh diubah; pelunasan kewajiban bila ikatan berakhir."], ["Beasiswa Karyawan", "Pasal 5", "Penutup", "Berlaku sejak 1 Januari 2025; lampiran satu kesatuan; dapat berubah."], ["Beasiswa Anak", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Karyawan Tetap, Level Jabatan, Calon Penerima Beasiswa, Besaran Beasiswa, Beasiswa Bakti Pendidikan, Beasiswa Plus, Ikatan Perjanjian."], ["Beasiswa Anak", "Pasal 2", "Kebijakan Umum", "Syarat karyawan (3 th, Karyawan Tetap, tanpa SP, kinerja min. B, persetujuan HR & atasan min. L2); daftar awal tahun ajaran & lolos seleksi; calon penerima bebas kriminal/narkoba/masalah medsos."], ["Beasiswa Anak", "Pasal 3", "Persyaratan Beasiswa Bakti Pendidikan", "Berdasarkan jenjang & level (Lamp. I); tidak tinggal kelas; rapor min. 90,00; dana kelulusan kelas 12 (akreditasi min. B); IP D3/S1 3,25 teknik / 3,50 non-teknik, IPK 3,00; batas masa studi D3 6 smt, S1 8 smt, S1 ganda 10 smt; tanpa ikatan, berbasis kuota."], ["Beasiswa Anak", "Pasal 4", "Persyaratan Beasiswa Plus", "Untuk perguruan tinggi bagi karyawan L1-7; D3 mulai smt 3, S1 mulai smt 5 (IP min. 3,30); persetujuan HR, wawancara user, Ikatan Perjanjian, ketentuan pengupahan; prioritas jurusan Lamp. III."], ["Beasiswa Anak", "Pasal 5", "Pencairan Bakti Pendidikan", "SD-SMA/SMK bulanan selama 1 tahun; dana kelulusan kelas 12 ikut pencairan PT; D3/S1 per semester selama 1 tahun; besaran Lamp. I."], ["Beasiswa Anak", "Pasal 6", "Pencairan Beasiswa Plus", "Menanggung SPP, Biaya Pengembangan Fasilitas, Non-SPP (langsung ke institusi/reimbursement) selama 2 tahun (4 semester); keberlanjutan ditinjau tiap periode (prestasi & kesiapan sebagai calon karyawan)."], ["Beasiswa Anak", "Pasal 7", "Berakhirnya Pendanaan", "Lulus; karyawan PHK (pensiun: lanjut s.d. masa berlaku; pelanggaran/resign: berhenti); pelanggaran, menikah, berhenti sekolah, dokumen tidak lengkap, laporan palsu, terikat institusi lain."], ["Beasiswa Anak", "Pasal 8", "Pasca Kelulusan Beasiswa Plus", "Wajib Ikatan Perjanjian (Lamp. II); penalti bila resign; masa ikatan tidak boleh diubah; pelunasan kewajiban."], ["Beasiswa Anak", "Pasal 9", "Penutup", "Berlaku sejak 1 Januari 2025; lampiran satu kesatuan; dapat berubah."], ["Sales Promotor", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Kantor Perwakilan, Pihak Ketiga, Sales Promotor, Karyawan, Kepala Perwakilan, Kegiatan Pendukung, Insentif."], ["Sales Promotor", "Pasal 2", "Ketentuan Penugasan", "Penugasan ke luar lokasi kerja dengan Surat Tugas yang ditandatangani Kepala Perwakilan; Karyawan dapat ditetapkan untuk Kegiatan Pendukung; Sales Promotor hanya sesuai fungsi utama."], ["Sales Promotor", "Pasal 3", "Penggantian Biaya & Insentif", "Reimbursement transport + bukti asli + Surat Tugas, maks. 10 hari kerja; insentif sesuai Lamp. II; dibayar via bagian Administrasi Kantor Perwakilan."], ["Sales Promotor", "Pasal 4", "Penutup", "Berlaku sejak 1 Maret 2025; mencabut Peraturan Direksi 001/COM-JKT/INT/XI/23."], ["Pelatihan", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Level Jabatan, Pelatihan, Kompetensi, CBHRM, Kurikulum, Rencana Pelatihan Tahunan, Usulan Pelatihan, SME, Ikatan Perjanjian, Pelatihan Internal, Pelatihan Eksternal."], ["Pelatihan", "Pasal 2", "Kebijakan Umum", "Pendekatan CBHRM; pelatihan untuk kompetensi posisi saat ini & tujuan; prinsip kesetaraan, relevansi, efektivitas."], ["Pelatihan", "Pasal 3", "Kurikulum Pelatihan", "HR memfasilitasi Kepala Bagian; kurikulum per posisi dari kamus & matriks kompetensi; meliputi keterampilan, pengetahuan, sikap; ditinjau berkala."], ["Pelatihan", "Pasal 4", "Klasifikasi Pelatihan", "Tujuan: Sertifikasi / Non Sertifikasi. Penyelenggara: Internal Unit, Inhouse, Publik. HR menentukan jenis pelatihan."], ["Pelatihan", "Pasal 5", "Rencana Pelatihan Tahunan", "Disusun HR dari analisis kesenjangan kompetensi; dipublikasikan ke atasan langsung sesuai LoA."], ["Pelatihan", "Pasal 6", "Usulan Pelatihan", "Bagian/unit kerja berwenang mengusulkan sesuai LoA; HR memverifikasi dan menentukan penyelenggara."], ["Pelatihan", "Pasal 7", "Ikatan Perjanjian", "Perusahaan menentukan pelatihan yang mensyaratkan ikatan; masa ikatan tidak boleh diubah; penalti bila ikatan diakhiri (dirujuk ke 'lampiran II', faktual di Lampiran I)."], ["Pelatihan", "Pasal 8", "Fasilitator", "HR menunjuk fasilitator; pelatihan spesifik departemen sesuai LoA; pelatihan internal oleh SME ditunjuk bagian."], ["Pelatihan", "Pasal 9", "Pelaksanaan", "Biaya pelatihan yang disetujui ditanggung Perusahaan; sesuai jadwal/metode/lokasi; peserta wajib hadir dan aktif."], ["Pelatihan", "Pasal 10", "Evaluasi", "Evaluasi penyelenggaraan, pre/post-test, project assignment, penerapan di tempat kerja; evaluasi khusus pelatihan strategis; umpan balik peserta & fasilitator."], ["Pelatihan", "Pasal 11", "Pencatatan Rekaman", "Jam pelatihan dan kontribusi SME sebagai fasilitator dicatat di Learning Management System."], ["Pelatihan", "Pasal 12", "Penutup", "Berlaku sejak 1 April 2025; lampiran satu kesatuan; dapat berubah."], ["Premi", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Karyawan Tetap, Pejabat Berwenang, Kompetensi, CBHRM, Upah, Premi."], ["Premi", "Pasal 2", "Kebijakan Umum", "Premi berbasis CBHRM; memperhatikan relevansi kompetensi dan efektivitas terhadap kinerja."], ["Premi", "Pasal 3", "Ketentuan Pemberian", "Karyawan Tetap aktif min. 1 bulan pada posisi Lamp. I; kuota/kategori/besaran Lamp. II; dibayar bulanan bersama upah; evaluasi 3 bulanan; tidak untuk yang kena sanksi, resign, atau pelanggaran."], ["Premi", "Pasal 4", "Pengecualian", "Pengecualian diputuskan manajemen; premi dapat dicabut dengan persetujuan Pejabat Berwenang."], ["Premi", "Pasal 5", "Penutup", "Berlaku sejak 1 Mei 2025; lampiran satu kesatuan; dapat berubah."], ["Seragam", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan (PT HIT dan PT SKM), Karyawan, Seragam Kerja."], ["Seragam", "Pasal 2", "Ketentuan Seragam Kerja", "Diberikan sesuai jenis pekerjaan (Lamp. I & II); wajib dipakai, dijaga, tidak diperjualbelikan; ganti sebelum periode hanya bila rusak & dikonfirmasi GS; ketentuan pakaian bagi yang tidak menerima seragam (rapi, sopan, non-SARA; kerudung & handsock diperbolehkan)."], ["Seragam", "Pasal 3", "Pengajuan, Pengadaan, Distribusi", "Pengajuan reguler September, distribusi Januari (Lamp. III); di luar periode via formulir online ke GS; dikelola General Services."], ["Seragam", "Pasal 4", "Pengembalian & Pemusnahan", "Wajib dikembalikan bila pindah bagian tanpa seragam, menerima pengganti, atau resign/PHK; kekurangan diganti sesuai harga HR; dimusnahkan dengan Berita Acara + dokumentasi."], ["Seragam", "Pasal 5", "Penutup", "Berlaku sejak 1 Desember 2025; lampiran satu kesatuan; dapat berubah; mencabut SK 203/ADM-JKT/INT/IX/23."], ["Kend. Inventaris", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Level Jabatan, Kendaraan Inventaris."], ["Kend. Inventaris", "Pasal 2", "Ketentuan Pemberian", "Diberikan ke level di Lamp. I; jenis & masa pakai ditentukan Perusahaan (dapat diperpanjang); karyawan wajib menjaga."], ["Kend. Inventaris", "Pasal 3", "Penunjang Electric Vehicle", "1 wall charger (pemasangan pertama ditanggung); fasilitas penunjang Lamp. II; biaya penambahan meter/daya listrik tidak ditanggung."], ["Kend. Inventaris", "Pasal 4", "Penunjang Non-Electric Vehicle", "Fasilitas penunjang (BBM) sesuai Lamp. III."], ["Kend. Inventaris", "Pasal 5", "Pemeliharaan & Administrasi", "Perusahaan menanggung perawatan berkala, perbaikan non-kelalaian di bengkel yang ditunjuk, perpanjangan STNK & administrasi."], ["Kend. Inventaris", "Pasal 6", "Berakhirnya Fasilitas", "Hubungan kerja berakhir, dicabut, kendaraan diganti, atau diputuskan lain oleh COO; dikembalikan via GS sesuai kondisi awal; tanpa ganti rugi."], ["Kend. Inventaris", "Pasal 7", "Penutup", "Berlaku sejak 1 Januari 2026; mencabut SK 301/HRD/SK-Dir/XII/2018."], ["Kend. Operasional", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Kendaraan Operasional."], ["Kend. Operasional", "Pasal 2", "Ketentuan Pemberian", "Sesuai fungsi pekerjaan yang ditetapkan Direksi; jenis & masa pakai Lamp. I; EV: charging kantor/reimburse SPKLU dengan persetujuan atasan; non-EV: penggantian BBM; dilarang untuk kepentingan pribadi."], ["Kend. Operasional", "Pasal 3", "Pemeliharaan & Administrasi", "Perusahaan menanggung perawatan berkala, perbaikan non-kelalaian, perpanjangan STNK & administrasi."], ["Kend. Operasional", "Pasal 4", "Berakhirnya Fasilitas", "Hubungan kerja berakhir, dicabut, diganti, atau diputuskan lain oleh COO; dikembalikan via GS; tanpa ganti rugi."], ["Kend. Operasional", "Pasal 5", "Penutup", "Berlaku sejak 1 Januari 2026; lampiran satu kesatuan; dapat berubah."], ["Shift", "Pasal 1", "Ketentuan Umum", "Definisi Perusahaan, Karyawan, Karyawan Harian, Karyawan Bulanan, Tunjangan Kerja Shift; dihitung per hari per kelompok shift; dibayar bersama gaji bulan berjalan."], ["Shift", "Pasal 2", "Besaran Tunjangan", "Shift II Rp3.000; Shift III Rp4.000; Shift Panjang Rp4.500 per hari."], ["Shift", "Pasal 3", "Penutup", "Berlaku sejak ditetapkan (1 Februari 2026); dapat berubah; mencabut SK 43/ADM-KDS/I/2022."], ["Penghargaan Pensiun", "Butir 1", "Dasar Pemberian", "Penghargaan diberikan kepada Karyawan pensiun; masa kerja dihitung sejak tanggal bergabung di Perusahaan."], ["Penghargaan Pensiun", "Butir 2", "Kategori", "Kategori penghargaan mengikuti Lampiran I: > 30 tahun Plakat A; 15-30 tahun Plakat B; < 15 tahun Piagam."], ["Penghargaan Pensiun", "Butir 3", "Desain", "Desain penghargaan bagi Karyawan yang memasuki masa pensiun ditetapkan Perusahaan sesuai kebijakan."], ["Penghargaan Pensiun", "Butir 4", "Penutup", "Berlaku sejak ditetapkan (1 Oktober 2026); dapat berubah sewaktu-waktu bila ada kekeliruan, kekurangan, atau ketidaksesuaian."], ["Tunjangan Masa Kerja", "Pasal 1", "Ketentuan Umum", "Tunjangan masa kerja = tunjangan tetap bagi Karyawan Harian (Tetap maupun Kontrak) dengan masa kerja min. 1 tahun; dihitung per hari atau 30 hari sebulan; masa kerja dihitung sejak diterima sebagai Karyawan Harian; dibayar bersama gaji bulan berjalan."], ["Tunjangan Masa Kerja", "Pasal 2", "Besaran Tunjangan", "30 tingkat masa kerja: Rp150/hari (Rp4.500/bln) untuk 1 - <2 tahun, bertambah Rp150/hari tiap tahun, sampai Rp4.500/hari (Rp135.000/bln) untuk 30 tahun ke atas."], ["Tunjangan Masa Kerja", "Pasal 3", "Pencabutan", "SK 188/HRD/SK-Dir/VIII/2018 dinyatakan tidak berlaku."], ["Tunjangan Masa Kerja", "Pasal 4", "Mulai Berlaku", "Berlaku mulai 1 Februari 2022."], ["Perjalanan Dinas", "Pasal 1", "Definisi", "Definisi: Perusahaan, Level Jabatan, Perjalanan Dinas, Pejabat Berwenang, Administrator Perjalanan, Tunjangan Perjalanan Dinas, Transportasi, Akomodasi, Biaya Makan, Biaya Entertainment, Biaya Komunikasi, Biaya Binatu, Cash Advance/Kasbon, Reimbursement, Formulir Perjalanan Dinas, Laporan Pertanggungjawaban Perjalanan Dinas (LPJ)."], ["Perjalanan Dinas", "Pasal 2", "Ketentuan Umum", "Perjalanan Dinas dalam negeri dibedakan ≤150 KM dan >150 KM sekali tempuh; ada pula luar negeri. Tiket dipesan via Administrator Perjalanan atau mandiri (reimburse). Akomodasi wajib melalui partner perjalanan/hotel rekanan. Biaya Entertainment hanya atas persetujuan. Biaya Binatu untuk perjalanan >4 hari, setelah hari kedua, maks 4 potong/2 kg per hari."], ["Perjalanan Dinas", "Pasal 3", "Perjalanan Dinas Dalam Negeri", "≤150 KM: kendaraan operasional/pribadi/sewaan/umum; transportasi, BBM, parkir, tol diganti wajar dengan kuitansi. >150 KM: pilih udara/darat/laut; Tunjangan, Akomodasi dan Biaya Makan sesuai Lampiran I. BBM/EV kendaraan pribadi dihitung sesuai Lampiran II."], ["Perjalanan Dinas", "Pasal 4", "Perjalanan Dinas Luar Negeri", "Menggunakan transportasi udara; transportasi lokal diganti; Tunjangan dan Biaya Makan sesuai Lampiran III; disediakan pocket modem/router Wi-Fi atau Biaya Komunikasi diganti."], ["Perjalanan Dinas", "Pasal 5", "Cash Advance, Pertanggungjawaban & Reimbursement", "Cash Advance diajukan dengan Formulir Perjalanan Dinas ke Finance; LPJ maksimal 10 hari kerja setelah kembali; reimbursement diajukan maksimal 10 hari kerja; pelanggaran batas waktu/ketentuan perlu persetujuan Direktur Departemen."], ["Perjalanan Dinas", "Pasal 6", "Pengecualian", "Hal di luar ketentuan SK ini dapat dikecualikan dengan persetujuan Pejabat Berwenang."], ["Perjalanan Dinas", "Pasal 7", "Penutup", "Berlaku sejak ditetapkan (1 September 2026); mencabut SK No. 001/ADM-JKT/INT/VII/26 tentang Perjalanan Dinas."], ["Perjalanan Dinas", "Lampiran I", "Fasilitas Perjalanan Dinas Dalam Negeri", "Tabel per Level 1-7: Tunjangan per hari, Bia  nomor tidak memakai kode 'INT', ditetapkan di Kudus; SK Shift pasangan (No. 43/ADM-KDS/I/2022) sudah dicabut SK Shift 2026 sedangkan SK ini tidak disebut dicabut. Nominal belum berubah sejak 2022.", "Konfirmasi SK ini masih berlaku dan perlu/tidaknya penyesuaian nominal."], ["33", "Perjalanan Dinas", "SK ini mencabut SK Perjalanan Dinas No. 001/ADM-JKT/INT/VII/26, namun file SK VII/26 tidak ada di folder. Selang waktu 2 bulan (Juli → September 2026) menunjukkan perubahan cepat.", "Pastikan hanya versi IX/26 yang dipakai; arsipkan versi VII/26 sebagai SK tidak berlaku."], ["34", "Perjalanan Dinas", "Rujukan lintas SK tidak mutakhir: Komp. LK 2024 merujuk SK Perjalanan Dinas 067/2022 dan Memo China merujuk SK 095/2024, sementara SK yang berlaku kini No. 001/ADM-JKT/INT/IX/26.", "Perbarui rujukan pada Komp. LK 2024 dan Memo China ke SK IX/26."], ["35", "Perjalanan Dinas", "Memo China menetapkan batas makan/akomodasi dalam RMB (RMB 120 makan; 300 normal & 400 high season), sedangkan Lampiran III memakai USD (makan USD 30-45; akomodasi USD 150-300) dan tidak mengatur China secara khusus.", "Tegaskan apakah Memo China tetap berlaku sebagai pengecualian (Pasal 6) atau digantikan Lampiran III."], ["36", "Perjalanan Dinas", "Rumus penggantian BBM kendaraan pribadi Perjalanan Dinas = KM ÷ 7 × harga BBM/liter, sedangkan SK UTH Driver/Sales Promotor memakai KM ÷ 25 (reimburse bensin).", "Konfirmasi apakah perbedaan rasio disengaja (jenis kendaraan/penugasan berbeda)."], ["37", "Perjalanan Dinas", "Tunjangan Perjalanan Dinas (Rp20.000/hari, L3-L7) dan Biaya Makan dapat tumpang tindih dengan Komp. LK 2024 (tunjangan/penggantian dinas luar kota) serta uang makan di SK lain.", "Pastikan tidak ada pembayaran ganda untuk hari/penugasan yang sama."], ["38", "Perjalanan Dinas", "Tabel lampiran berbentuk gambar (tidak bisa disalin/dicari teks). Level 1-2 Biaya Makan 'sesuai tagihan, jumlah wajar' tanpa batas angka; 'wajar' tidak didefinisikan.", "Pertimbangkan versi teks/Excel lampiran dan batas wajar yang tegas."]]}, "km": {"Kamus Istilah SK": [["Kamus istilah dari 24 dokumen SK/Peraturan/Memo/Pengumuman di folder 'SK Updated' (seluruh 24 SK tersedia sebagai PDF per 21 Okt 2026). Kode SK lihat sheet 'Indeks Kode SK' di Rangkuman_SK.xlsx. 'Definisi resmi SK' = dikutip/hampir sama dengan Ketentuan Umum; 'Penjelasan tambahan' = istilah yang dipakai di SK tetapi tidak didefinisikan, dirangkum dari pasal/lampiran terkait.", "", "", "", "", "", "", ""], ["No", "Istilah", "Singkatan / Padanan", "Pengertian", "Sumber SK", "Pasal / Bagian", "Jenis", "Catatan"], ["1", "Administrator Perjalanan", "", "Pihak/unit di Perusahaan yang memesan tiket dan akomodasi serta mengelola administrasi Perjalanan Dinas.", "Perjalanan Dinas", "Pasal 1; Pasal 2", "Definisi resmi SK", ""], ["2", "Akomodasi", "", "Biaya penginapan selama Perjalanan Dinas; wajib melalui partner perjalanan/hotel rekanan dengan batas maksimal per malam menurut Level Jabatan.", "Perjalanan Dinas", "Pasal 1; Pasal 2; Lampiran I & III", "Definisi resmi SK", ""], ["3", "Anak", "", "Individu yang memiliki hubungan dengan Karyawan dan terikat oleh hubungan darah secara langsung maupun adopsi yang sah secara hukum.", "Kesehatan", "Pasal 1 butir 8", "Definisi resmi SK", "Ditanggung anak ke-1 s.d. 3, < 21 tahun, belum menikah, belum berpenghasilan."], ["4", "Apotek Rekanan", "", "Apotek yang bekerja sama dan ditunjuk oleh Perusahaan.", "Kesehatan", "Pasal 1 butir 11", "Definisi resmi SK", "Kudus: Apotek Karya Sehat (Lampiran II); di luar Kudus bebas memilih."], ["5", "Balen (Muatan Balen)", "", "Muatan yang berasal dari dan/atau ditujukan ke lokasi operasional Perusahaan, yang diangkut dalam rangka Penugasan Operasional.", "UTH Driver", "Pasal 5 ayat 1", "Penjelasan tambahan", "Definisi dirangkum dari Pasal 5 ayat 1; 'balen' tidak didefinisikan sendiri di Ketentuan Umum."], ["6", "Bantuan Dana Kelulusan", "", "Dana sekali bayar saat kelulusan kelas 6, 9, dan 12; untuk kelas 12 diberikan bila diterima di
